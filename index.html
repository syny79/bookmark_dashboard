<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>세상의 모든 즐겨찾기</title>
    
    <!-- Tailwind CSS 및 FontAwesome 아이콘 로드 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <!-- 모바일 터치 환경에서의 HTML5 Drag & Drop 지원을 위한 Polyfill -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/mobile-drag-drop@2.3.0-rc.2/default.css">
    <script src="https://cdn.jsdelivr.net/npm/mobile-drag-drop@2.3.0-rc.2/index.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mobile-drag-drop@2.3.0-rc.2/scroll-behaviour.min.js"></script>
    
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --bg-color: #F3F4F6;
            --card-bg: #FFFFFF;
            --text-main: #1F2937;
            --text-muted: #6B7280;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            overscroll-behavior-y: none;
        }

        /* 썸네일 컨테이너 (일반 웹) */
        .thumbnail-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 */
            overflow: hidden;
            background-color: #e5e7eb;
            border-radius: 0.5rem 0.5rem 0 0;
        }
        
        /* 포스터 컨테이너 (영화/책) */
        .poster-container {
            position: relative;
            width: 100%;
            padding-top: 140%; /* 포스터 비율 */
            overflow: hidden;
            background-color: #e5e7eb;
            border-radius: 0.5rem 0.5rem 0 0;
        }

        .thumbnail-container img, .poster-container img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            border: none;
        }
        
        .bookmark-card {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .drag-over { background-color: #EEF2FF !important; border: 2px dashed #818CF8 !important; }
        .card-drag-over { opacity: 0.5; transform: scale(0.98); border-color: #6366f1 !important; box-shadow: inset 0 0 0 2px #6366f1; }

        @keyframes pin-bounce {
            0% { transform: scale(1); }
            40% { transform: scale(1.5) rotate(-20deg); color: #4F46E5; }
            70% { transform: scale(1.5) rotate(20deg); color: #4F46E5; }
            100% { transform: scale(1); }
        }
        .pin-animating i {
            animation: pin-bounce 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        
        /* 별점 호버 효과 */
        .star-rating i { cursor: pointer; transition: color 0.2s; }
        .star-rating i.active { color: #F59E0B; } /* 노란색 */
    </style>
</head>
<body class="min-h-screen flex flex-col bg-gray-50">

    <header class="bg-white shadow-sm sticky top-0 z-30 border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-indigo-600 rounded-lg flex items-center justify-center text-white shadow-md">
                    <i class="fas fa-layer-group text-xl"></i>
                </div>
                <h1 class="text-xl sm:text-2xl font-bold text-gray-900 tracking-tight">세상의 모든 즐겨찾기</h1>
            </div>
            
            <div class="flex items-center gap-2 sm:gap-4">
                <div id="auth-section" class="flex items-center gap-2">
                    <button onclick="window.handleGoogleLogin()" class="px-3 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs sm:text-sm font-bold transition-all shadow-sm flex items-center gap-2 cursor-pointer">
                        <i class="fab fa-google"></i> 구글 로그인
                    </button>
                </div>
                <button onclick="window.openDataModal()" class="px-3 py-2 text-gray-600 hover:text-indigo-600 hover:bg-indigo-50 rounded-lg transition-colors flex items-center gap-2 border border-transparent hover:border-indigo-100 shadow-sm cursor-pointer" title="데이터 관리 및 백업">
                    <i class="fas fa-cloud text-lg"></i> <span class="hidden sm:inline text-sm font-bold">데이터 관리</span>
                </button>
            </div>
        </div>
    </header>

    <div class="flex-grow max-w-7xl mx-auto w-full flex flex-col md:flex-row px-4 sm:px-6 lg:px-8 py-6 gap-6 h-[calc(100vh-73px)]">
        
        <aside class="w-full md:w-64 flex-shrink-0 bg-white rounded-xl shadow-sm border border-gray-100 flex flex-col h-64 md:h-full overflow-hidden">
            <div class="p-4 border-b border-gray-50">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="font-bold text-gray-800 text-sm">내 컬렉션</h2>
                    <select id="sort-select" onchange="changeSort(this.value)" class="text-xs border-gray-200 bg-gray-50 text-gray-600 rounded-md py-1 px-2 focus:ring-1 focus:ring-indigo-500 cursor-pointer outline-none">
                        <option value="updatedAt_desc">최근 수정순</option>
                        <option value="createdAt_desc">최신 생성순</option>
                        <option value="name_asc">이름순</option>
                    </select>
                </div>
                
                <button onclick="openCategoryModal()" class="w-full py-2 bg-indigo-50 text-indigo-600 rounded-lg text-sm font-bold hover:bg-indigo-100 transition-colors flex items-center justify-center gap-2 border border-indigo-100 cursor-pointer">
                    <i class="fas fa-plus"></i> 새 카테고리
                </button>
            </div>

            <div id="sidebar-category-list" class="flex-grow overflow-y-auto p-2 space-y-1 hide-scrollbar">
                <!-- 동적 카테고리 항목 -->
            </div>
        </aside>

        <main class="flex-1 min-w-0 bg-white rounded-xl shadow-sm border border-gray-100 flex flex-col h-full overflow-hidden relative">
            
            <!-- 상단 검색 영역 -->
            <div id="search-section" class="hidden p-4 border-b border-gray-100 bg-gray-50 flex flex-col sm:flex-row gap-2">
                <div class="flex flex-grow shadow-sm rounded-lg overflow-hidden border border-gray-300 focus-within:ring-2 focus-within:ring-indigo-500 focus-within:border-indigo-500 transition-shadow bg-white">
                    <select id="search-engine" class="px-3 py-2 bg-gray-100 border-r border-gray-300 text-sm font-medium text-gray-700 outline-none cursor-pointer hover:bg-gray-200">
                        <option value="google">Google</option>
                        <option value="naver">Naver</option>
                    </select>
                    <input type="text" id="web-search-input" placeholder="정보 검색 후 바로 저장하세요..." class="w-full px-4 py-2 outline-none text-sm" onkeypress="if(event.key === 'Enter') executeWebSearch()">
                    <button onclick="executeWebSearch()" class="px-4 py-2 text-gray-500 hover:text-indigo-600 hover:bg-gray-100 transition-colors flex items-center justify-center cursor-pointer" title="검색하기">
                        <i class="fas fa-search"></i>
                    </button>
                </div>
                <button onclick="saveSearchAsBookmark()" class="flex-shrink-0 px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-bold rounded-lg shadow-sm transition-colors flex items-center gap-2 cursor-pointer">
                    <i class="fas fa-star"></i> 이 검색 저장
                </button>
            </div>

            <div id="empty-state" class="hidden h-full flex-col items-center justify-center p-8 text-center bg-gray-50">
                <div class="w-20 h-20 bg-white shadow-sm rounded-full flex items-center justify-center mb-4 border border-gray-100">
                    <i class="fas fa-folder-open text-3xl text-gray-400"></i>
                </div>
                <h2 id="empty-state-title" class="text-lg font-bold text-gray-700 mb-2">구글 로그인이 필요합니다</h2>
                <p id="empty-state-desc" class="text-gray-500 text-sm mb-6 max-w-sm">상단의 [구글 로그인] 버튼을 눌러 로그인하시면<br>저장된 즐겨찾기를 불러올 수 있습니다.</p>
                <button onclick="window.handleGoogleLogin()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm font-bold transition-all shadow-md flex items-center gap-2 cursor-pointer">
                    <i class="fab fa-google"></i> 구글 로그인하기
                </button>
            </div>

            <div id="dashboard-content" class="flex-1 overflow-y-auto p-4 sm:p-6 hide-scrollbar relative bg-gray-50/50">
                <!-- 북마크 컨텐츠 추가 위치 -->
            </div>
        </main>
    </div>

    <!-- 새 카테고리 모달 -->
    <div id="category-modal" class="fixed inset-0 bg-gray-900 bg-opacity-50 modal-backdrop hidden flex items-center justify-center z-50 transition-opacity">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-md mx-4 transform scale-95 transition-transform duration-200" id="category-modal-content">
            <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center">
                <h3 class="text-lg font-bold text-gray-900" id="category-modal-title">새 카테고리 만들기</h3>
                <button onclick="closeCategoryModal()" class="text-gray-400 hover:text-gray-600 focus:outline-none">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            <div class="p-6">
                <input type="hidden" id="edit-category-id">
                
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">카테고리 유형 (Type) <span class="text-xs text-indigo-500 font-normal ml-1">유형에 따라 뷰(View)가 바뀝니다</span></label>
                    <div class="grid grid-cols-3 gap-2">
                        <label class="cursor-pointer">
                            <input type="radio" name="cat-type" value="web" class="peer sr-only" checked>
                            <div class="text-center px-2 py-3 border border-gray-200 rounded-lg peer-checked:bg-indigo-50 peer-checked:border-indigo-500 peer-checked:text-indigo-700 hover:bg-gray-50 transition-colors">
                                <i class="fas fa-globe mb-1 text-lg"></i><div class="text-xs font-bold">일반 웹</div>
                            </div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="cat-type" value="place" class="peer sr-only">
                            <div class="text-center px-2 py-3 border border-gray-200 rounded-lg peer-checked:bg-indigo-50 peer-checked:border-indigo-500 peer-checked:text-indigo-700 hover:bg-gray-50 transition-colors">
                                <i class="fas fa-map-marker-alt mb-1 text-lg"></i><div class="text-xs font-bold">장소/맛집</div>
                            </div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="cat-type" value="media" class="peer sr-only">
                            <div class="text-center px-2 py-3 border border-gray-200 rounded-lg peer-checked:bg-indigo-50 peer-checked:border-indigo-500 peer-checked:text-indigo-700 hover:bg-gray-50 transition-colors">
                                <i class="fas fa-film mb-1 text-lg"></i><div class="text-xs font-bold">영화/책</div>
                            </div>
                        </label>
                    </div>
                </div>

                <div class="mb-5">
                    <label for="category-name" class="block text-sm font-medium text-gray-700 mb-2">카테고리 이름</label>
                    <input type="text" id="category-name" placeholder="예: 디자인 레퍼런스, 가고싶은 카페" 
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none"
                           onkeypress="if(event.key === 'Enter') saveCategory()">
                    <p id="category-error" class="text-red-500 text-xs mt-2 hidden">카테고리 이름을 입력해주세요.</p>
                </div>
                
                <div class="flex gap-2 justify-center flex-wrap">
                    <button class="icon-btn w-10 h-10 rounded bg-indigo-100 text-indigo-600 border-2 border-indigo-500 flex items-center justify-center" data-icon="fa-folder"><i class="fas fa-folder"></i></button>
                    <button class="icon-btn w-10 h-10 rounded bg-gray-100 text-gray-600 border-2 border-transparent hover:bg-gray-200 flex items-center justify-center" data-icon="fa-map"><i class="fas fa-map"></i></button>
                    <button class="icon-btn w-10 h-10 rounded bg-gray-100 text-gray-600 border-2 border-transparent hover:bg-gray-200 flex items-center justify-center" data-icon="fa-utensils"><i class="fas fa-utensils"></i></button>
                    <button class="icon-btn w-10 h-10 rounded bg-gray-100 text-gray-600 border-2 border-transparent hover:bg-gray-200 flex items-center justify-center" data-icon="fa-book"><i class="fas fa-book"></i></button>
                    <button class="icon-btn w-10 h-10 rounded bg-gray-100 text-gray-600 border-2 border-transparent hover:bg-gray-200 flex items-center justify-center" data-icon="fa-video"><i class="fas fa-video"></i></button>
                    <button class="icon-btn w-10 h-10 rounded bg-gray-100 text-gray-600 border-2 border-transparent hover:bg-gray-200 flex items-center justify-center" data-icon="fa-star"><i class="fas fa-star"></i></button>
                </div>
                <input type="hidden" id="selected-icon" value="fa-folder">
            </div>
            <div class="px-6 py-4 bg-gray-50 rounded-b-xl border-t border-gray-100 flex justify-end gap-3">
                <button onclick="closeCategoryModal()" class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 focus:outline-none">취소</button>
                <button onclick="saveCategory()" id="btn-save-category" class="px-4 py-2 text-sm font-medium text-white bg-indigo-600 rounded-lg hover:bg-indigo-700 focus:outline-none shadow-sm">추가하기</button>
            </div>
        </div>
    </div>

    <!-- 링크/정보 추가 모달 -->
    <div id="bookmark-modal" class="fixed inset-0 bg-gray-900 bg-opacity-50 modal-backdrop hidden flex items-center justify-center z-50 transition-opacity">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-md mx-4 transform scale-95 transition-transform duration-200" id="bookmark-modal-content">
            <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center">
                <h3 class="text-lg font-bold text-gray-900" id="bookmark-modal-title">새 정보 스크랩</h3>
                <button onclick="closeBookmarkModal()" class="text-gray-400 hover:text-gray-600 focus:outline-none">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            <div class="p-6 space-y-4 max-h-[70vh] overflow-y-auto">
                <input type="hidden" id="target-category-id">
                <input type="hidden" id="edit-bookmark-id">
                <input type="hidden" id="current-cat-type" value="web">
                
                <div>
                    <label id="url-label" for="bookmark-url" class="block text-sm font-medium text-gray-700 mb-1">URL 주소 <span class="text-red-500">*</span></label>
                    <input type="url" id="bookmark-url" placeholder="https://example.com" 
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none"
                           onblur="fetchMetadata(this.value)">
                    <p id="url-error" class="text-red-500 text-xs mt-1 hidden">유효한 URL을 입력해주세요.</p>
                </div>

                <!-- 미디어(영화/책) 전용 입력 폼 -->
                <div id="media-extra-fields" class="hidden bg-indigo-50/50 p-4 rounded-lg border border-indigo-100 space-y-3">
                    <div>
                        <label class="block text-sm font-medium text-indigo-900 mb-1">내 평점</label>
                        <div class="star-rating flex gap-1 text-2xl text-gray-300" id="modal-stars">
                            <i class="fas fa-star" data-val="1"></i>
                            <i class="fas fa-star" data-val="2"></i>
                            <i class="fas fa-star" data-val="3"></i>
                            <i class="fas fa-star" data-val="4"></i>
                            <i class="fas fa-star" data-val="5"></i>
                        </div>
                        <input type="hidden" id="bookmark-rating" value="0">
                    </div>
                    <div>
                        <label for="bookmark-review" class="block text-sm font-medium text-indigo-900 mb-1">한줄평 / 스크랩 메모</label>
                        <input type="text" id="bookmark-review" placeholder="나만의 짧은 감상평을 남겨보세요." 
                               class="w-full px-3 py-2 text-sm border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                </div>

                <div>
                    <label for="bookmark-title" class="block text-sm font-medium text-gray-700 mb-1" id="title-label">제목 (선택)</label>
                    <input type="text" id="bookmark-title" placeholder="자동으로 가져옵니다" 
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div>
                    <label for="bookmark-desc" class="block text-sm font-medium text-gray-700 mb-1" id="desc-label">설명 (선택)</label>
                    <textarea id="bookmark-desc" rows="2" placeholder="자동으로 가져옵니다" 
                              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none resize-none"></textarea>
                </div>
                
                <div id="preview-area" class="hidden mt-4 border border-gray-200 rounded-lg p-2 bg-gray-50">
                    <p class="text-xs text-gray-500 mb-2 font-semibold">정보 미리보기</p>
                    <div class="flex gap-3">
                        <div class="w-16 h-16 bg-gray-200 rounded overflow-hidden flex-shrink-0">
                            <img id="preview-img" src="" alt="preview" class="w-full h-full object-cover">
                        </div>
                        <div class="overflow-hidden flex flex-col justify-center">
                            <p id="preview-title" class="text-sm font-bold text-gray-800 truncate"></p>
                            <p id="preview-domain" class="text-xs text-gray-500 truncate mt-1"></p>
                        </div>
                    </div>
                </div>

                <div id="loading-indicator" class="hidden flex items-center justify-center py-4">
                    <i class="fas fa-spinner fa-spin text-indigo-500 text-2xl"></i>
                    <span class="ml-2 text-sm text-gray-600">페이지 정보 가져오는 중...</span>
                </div>
            </div>
            
            <div class="px-6 py-4 bg-gray-50 rounded-b-xl border-t border-gray-100 flex justify-end gap-3">
                <button onclick="closeBookmarkModal()" class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50">취소</button>
                <button id="btn-save-bookmark" onclick="saveBookmark()" class="px-4 py-2 text-sm font-medium text-white bg-indigo-600 rounded-lg hover:bg-indigo-700 shadow-sm">
                    <span id="btn-save-text"><i class="fas fa-save"></i> 저장하기</span>
                </button>
            </div>
        </div>
    </div>

    <!-- 링크 이동 모달 -->
    <div id="move-modal" class="fixed inset-0 bg-gray-900 bg-opacity-50 modal-backdrop hidden flex items-center justify-center z-50 transition-opacity">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-sm mx-4 transform scale-95 transition-transform duration-200" id="move-modal-content">
            <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center">
                <h3 class="text-lg font-bold text-gray-900">다른 컬렉션으로 이동</h3>
                <button onclick="window.closeMoveModal()" class="text-gray-400 hover:text-gray-600 focus:outline-none"><i class="fas fa-times text-xl"></i></button>
            </div>
            <div class="p-6">
                <input type="hidden" id="move-source-cat-id">
                <input type="hidden" id="move-target-bm-id">
                <label class="block text-sm font-medium text-gray-700 mb-2">이동할 목적지 선택</label>
                <select id="move-target-category" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none"></select>
            </div>
            <div class="px-6 py-4 bg-gray-50 rounded-b-xl flex justify-end gap-3">
                <button onclick="window.closeMoveModal()" class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50">취소</button>
                <button onclick="window.executeMoveBookmark()" class="px-4 py-2 text-sm font-medium text-white bg-indigo-600 rounded-lg hover:bg-indigo-700 shadow-sm">이동</button>
            </div>
        </div>
    </div>
    
    <!-- 데이터 관리 모달 -->
    <div id="data-modal" class="fixed inset-0 bg-gray-900 bg-opacity-50 modal-backdrop hidden flex items-center justify-center z-50 transition-opacity">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-md mx-4 transform scale-95 transition-transform duration-200" id="data-modal-content">
            <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center">
                <h3 class="text-lg font-bold text-gray-900">데이터 관리</h3>
                <button onclick="window.closeDataModal()" class="text-gray-400 hover:text-gray-600 focus:outline-none"><i class="fas fa-times text-xl"></i></button>
            </div>
            <div class="p-6 space-y-6">
                <div class="bg-gray-50 rounded-lg p-4 border border-gray-200">
                    <h4 class="text-sm font-bold text-gray-700 mb-2 flex items-center gap-2"><i class="fas fa-cloud"></i> 동기화 상태</h4>
                    <div id="cloud-sync-status" class="flex items-center gap-2 text-sm text-gray-600">연결 확인 중...</div>
                </div>
                <div>
                    <h4 class="text-sm font-bold text-gray-700 mb-3 flex items-center gap-2"><i class="fas fa-save"></i> 수동 백업</h4>
                    <div class="grid grid-cols-2 gap-3">
                        <button onclick="window.exportDataToJson()" class="flex flex-col items-center justify-center p-4 rounded-lg border-2 border-indigo-100 bg-indigo-50 text-indigo-700"><i class="fas fa-file-download text-2xl mb-2"></i><span class="text-sm font-bold">내보내기</span></button>
                        <label for="import-file" class="flex flex-col items-center justify-center p-4 rounded-lg border-2 border-gray-200 bg-white text-gray-700 cursor-pointer"><i class="fas fa-file-upload text-2xl mb-2"></i><span class="text-sm font-bold">불러오기</span><input type="file" id="import-file" accept=".json" class="hidden" onchange="window.importDataFromJson(event)"></label>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 삭제 확인 모달 -->
    <div id="confirm-modal" class="fixed inset-0 bg-gray-900 bg-opacity-50 modal-backdrop hidden flex items-center justify-center z-50 transition-opacity">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-sm mx-4 p-6 text-center transform scale-95 transition-transform duration-200" id="confirm-modal-content">
            <div class="w-12 h-12 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto mb-4"><i class="fas fa-exclamation-triangle text-xl"></i></div>
            <h3 id="confirm-modal-title" class="text-base font-bold text-gray-900 mb-2">삭제</h3>
            <p id="confirm-modal-desc" class="text-xs text-gray-500 mb-6">되돌릴 수 없습니다.</p>
            <div class="flex gap-3 justify-center">
                <button id="confirm-cancel-btn" class="px-4 py-2 text-xs font-medium text-gray-700 bg-gray-100 rounded-lg">취소</button>
                <button id="confirm-ok-btn" class="px-4 py-2 text-xs font-medium text-white bg-red-600 rounded-lg">삭제</button>
            </div>
        </div>
    </div>
    
    <!-- 토스트 컨테이너 -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <script>
        let categories = [];
        let selectedCategoryId = null;
        let currentSortMode = 'updatedAt_desc';
        const STORAGE_KEY = 'all_in_one_scrapbook_data';

        window.addEventListener('load', function() {
            MobileDragDrop.polyfill({ holdToDrag: 250, dragImageTranslateOverride: MobileDragDrop.scrollBehaviourDragImageTranslateOverride });
            window.addEventListener('touchmove', function() {}, {passive: false});
            init();
            setupStarRating();
        });

        function init() {
            setupIconSelector();
            renderLayout();
        }

        // --- 별점 UI 설정 ---
        function setupStarRating() {
            const stars = document.querySelectorAll('#modal-stars i');
            const ratingInput = document.getElementById('bookmark-rating');
            
            stars.forEach(star => {
                star.addEventListener('click', function() {
                    const val = parseInt(this.getAttribute('data-val'));
                    ratingInput.value = val;
                    updateStarUI(val);
                });
            });
        }
        
        function updateStarUI(val) {
            const stars = document.querySelectorAll('#modal-stars i');
            stars.forEach(s => {
                if(parseInt(s.getAttribute('data-val')) <= val) {
                    s.classList.add('active');
                } else {
                    s.classList.remove('active');
                }
            });
        }
        // ------------------

        function clearUserData() { categories = []; selectedCategoryId = null; localStorage.removeItem(STORAGE_KEY); renderLayout(); }
        
        function saveData() {
            if (window.isUserLoggedIn && window.isUserLoggedIn()) {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(categories));
                if (window.saveToCloud) window.saveToCloud();
            } else { showToast('로그인이 필요합니다.', 'warning'); }
            renderLayout();
        }

        function generateId() { return Math.random().toString(36).substr(2, 9) + Date.now().toString(36); }
        function changeSort(sortMode) { currentSortMode = sortMode; renderLayout(); }

        // 웹 검색 
        window.executeWebSearch = function() {
            const input = document.getElementById('web-search-input');
            const engine = document.getElementById('search-engine').value;
            const query = input.value.trim();
            if (!query) { showToast('검색어를 입력해주세요.', 'warning'); input.focus(); return; }
            let searchUrl = engine === 'google' ? `https://www.google.com/search?q=${encodeURIComponent(query)}` : `https://search.naver.com/search.naver?query=${encodeURIComponent(query)}`;
            window.open(searchUrl, '_blank');
        };

        window.saveSearchAsBookmark = function() {
            if (!selectedCategoryId) { showToast('저장할 카테고리를 선택하세요.', 'warning'); return; }
            const input = document.getElementById('web-search-input');
            const engine = document.getElementById('search-engine').value;
            const query = input.value.trim();
            if (!query) return;
            let searchUrl = engine === 'google' ? `https://www.google.com/search?q=${encodeURIComponent(query)}` : `https://search.naver.com/search.naver?query=${encodeURIComponent(query)}`;
            openBookmarkModal(selectedCategoryId);
            setTimeout(() => {
                document.getElementById('bookmark-url').value = searchUrl;
                document.getElementById('bookmark-title').value = `'${query}' 검색 결과`;
                fetchMetadata(searchUrl);
            }, 50);
        };

        function sortCategories() {
            return [...categories].sort((a, b) => {
                if (currentSortMode === 'updatedAt_desc') return (b.updatedAt || 0) - (a.updatedAt || 0);
                if (currentSortMode === 'createdAt_desc') return (b.createdAt || 0) - (a.createdAt || 0);
                if (currentSortMode === 'name_asc') return a.name.localeCompare(b.name, 'ko-KR');
                return 0;
            });
        }

        function selectCategory(id) { selectedCategoryId = id; renderMainContent(); renderSidebar(); }
        function renderLayout() {
            renderSidebar();
            if (!selectedCategoryId || !categories.find(c => c.id === selectedCategoryId)) {
                const sorted = sortCategories();
                selectedCategoryId = sorted.length > 0 ? sorted[0].id : null;
            }
            renderMainContent();
        }

        // Drag & Drop
        window.handleDragStart = function(e, categoryId, bookmarkId) {
            e.dataTransfer.setData('application/json', JSON.stringify({ categoryId, bookmarkId }));
            e.dataTransfer.effectAllowed = 'move';
            setTimeout(() => { e.target.classList.add('opacity-50'); }, 0);
        };
        window.handleDragEnd = function(e) { e.target.classList.remove('opacity-50'); };
        window.handleSidebarDragOver = function(e) { e.preventDefault(); e.currentTarget.classList.add('drag-over'); };
        window.handleSidebarDragLeave = function(e) { e.currentTarget.classList.remove('drag-over'); };
        window.handleSidebarDrop = function(e, targetCategoryId) {
            e.preventDefault(); e.currentTarget.classList.remove('drag-over');
            try {
                const data = JSON.parse(e.dataTransfer.getData('application/json'));
                if (data.categoryId === targetCategoryId) return; 
                const sourceCat = categories.find(c => c.id === data.categoryId);
                const targetCat = categories.find(c => c.id === targetCategoryId);
                if (sourceCat && targetCat) {
                    const bmIndex = sourceCat.bookmarks.findIndex(b => b.id === data.bookmarkId);
                    if (bmIndex > -1) {
                        const bm = sourceCat.bookmarks.splice(bmIndex, 1)[0];
                        targetCat.bookmarks.unshift(bm); 
                        sourceCat.updatedAt = Date.now(); targetCat.updatedAt = Date.now();
                        saveData(); showToast('이동 완료', 'success');
                    }
                }
            } catch (err) {}
        };
        window.handleCardDragOver = function(e) { e.preventDefault(); e.currentTarget.classList.add('card-drag-over'); };
        window.handleCardDragLeave = function(e) { e.currentTarget.classList.remove('card-drag-over'); };
        window.handleCardDrop = function(e, targetCategoryId, targetBookmarkId) {
            e.preventDefault(); e.currentTarget.classList.remove('card-drag-over');
            try {
                const data = JSON.parse(e.dataTransfer.getData('application/json'));
                if (data.categoryId === targetCategoryId && data.bookmarkId !== targetBookmarkId) {
                    const cat = categories.find(c => c.id === targetCategoryId);
                    const sourceIdx = cat.bookmarks.findIndex(b => b.id === data.bookmarkId);
                    const targetIdx = cat.bookmarks.findIndex(b => b.id === targetBookmarkId);
                    if (sourceIdx > -1 && targetIdx > -1) {
                        const [movedBm] = cat.bookmarks.splice(sourceIdx, 1);
                        cat.bookmarks.splice(targetIdx, 0, movedBm);
                        cat.updatedAt = Date.now(); saveData();
                    }
                }
            } catch(err) {}
        };

        function renderSidebar() {
            const listContainer = document.getElementById('sidebar-category-list');
            listContainer.innerHTML = '';
            if (!window.isUserLoggedIn || !window.isUserLoggedIn()) {
                listContainer.innerHTML = `<div class="p-4 text-center text-xs text-gray-400">로그인 필요</div>`;
                return;
            }
            sortCategories().forEach(cat => {
                const isSelected = cat.id === selectedCategoryId;
                const typeIcon = cat.type === 'place' ? 'fa-map-marker-alt' : (cat.type === 'media' ? 'fa-film' : 'fa-globe');
                const itemDiv = document.createElement('div');
                itemDiv.className = `w-full text-left px-3 py-2.5 rounded-lg flex items-center justify-between gap-2 transition-all duration-200 group cursor-pointer border ${isSelected ? 'bg-indigo-50 text-indigo-700 font-bold border-indigo-100 shadow-sm' : 'text-gray-600 hover:bg-gray-50 border-transparent'}`;
                itemDiv.ondragover = (e) => window.handleSidebarDragOver(e);
                itemDiv.ondragleave = (e) => window.handleSidebarDragLeave(e);
                itemDiv.ondrop = (e) => window.handleSidebarDrop(e, cat.id);
                itemDiv.onclick = (e) => { if(!e.target.closest('button')) selectCategory(cat.id); };
                
                itemDiv.innerHTML = `
                    <div class="flex items-center gap-2 overflow-hidden flex-grow pointer-events-none">
                        <div class="${isSelected ? 'text-indigo-600' : 'text-gray-400'} w-5 text-center shrink-0"><i class="fas ${cat.icon}"></i></div>
                        <div class="truncate text-[13px] flex-grow">${escapeHtml(cat.name)} <span class="text-[9px] text-gray-400 ml-1 opacity-60"><i class="fas ${typeIcon}"></i></span></div>
                    </div>
                    <div class="flex items-center gap-1 shrink-0">
                        <div class="text-[10px] ${isSelected ? 'bg-indigo-100 text-indigo-700' : 'bg-gray-100 text-gray-500'} px-2 py-0.5 rounded-full font-medium group-hover:hidden">${cat.bookmarks ? cat.bookmarks.length : 0}</div>
                        <div class="hidden group-hover:flex items-center gap-1">
                            <button onclick="openCategoryModal('${cat.id}')" class="text-gray-400 hover:text-indigo-600 w-6 h-6 rounded flex items-center justify-center bg-white border border-gray-200 shadow-sm cursor-pointer"><i class="fas fa-edit text-[10px]"></i></button>
                            <button onclick="deleteCategory('${cat.id}')" class="text-gray-400 hover:text-red-600 w-6 h-6 rounded flex items-center justify-center bg-white border border-gray-200 shadow-sm cursor-pointer"><i class="fas fa-trash-alt text-[10px]"></i></button>
                        </div>
                    </div>
                `;
                listContainer.appendChild(itemDiv);
            });
        }

        window.togglePin = function(e, categoryId, bookmarkId) {
            e.stopPropagation();
            e.currentTarget.classList.add('pin-animating');
            setTimeout(() => {
                const cat = categories.find(c => c.id === categoryId);
                if(cat) {
                    const bm = cat.bookmarks.find(b => b.id === bookmarkId);
                    if(bm) { bm.isPinned = !bm.isPinned; cat.updatedAt = Date.now(); saveData(); }
                }
            }, 400); 
        };

        // --- View Rendering Logic ---
        function renderMainContent() {
            const container = document.getElementById('dashboard-content');
            const emptyState = document.getElementById('empty-state');
            const searchSection = document.getElementById('search-section');
            if (!window.isUserLoggedIn || !window.isUserLoggedIn()) {
                searchSection.classList.add('hidden'); container.classList.add('hidden');
                emptyState.classList.remove('hidden'); emptyState.classList.add('flex'); return;
            }
            if (!selectedCategoryId || categories.length === 0) {
                searchSection.classList.add('hidden'); container.classList.add('hidden');
                emptyState.classList.remove('hidden'); emptyState.classList.add('flex');
                document.getElementById('empty-state-title').textContent = "선택된 컬렉션이 없습니다";
                document.getElementById('empty-state-desc').innerHTML = "새로운 카테고리를 만들어주세요.";
                return;
            }
            
            searchSection.classList.remove('hidden'); container.classList.remove('hidden');
            emptyState.classList.add('hidden'); emptyState.classList.remove('flex');
            
            const category = categories.find(c => c.id === selectedCategoryId);
            const type = category.type || 'web'; 
            const bookmarkCount = category.bookmarks ? category.bookmarks.length : 0;
            
            let typeBadge = type === 'place' ? '<span class="bg-emerald-100 text-emerald-700 text-[10px] px-2 py-0.5 rounded-full font-bold ml-2">장소/맛집 지도</span>' 
                          : type === 'media' ? '<span class="bg-pink-100 text-pink-700 text-[10px] px-2 py-0.5 rounded-full font-bold ml-2">영화/책 스크랩</span>'
                          : '<span class="bg-blue-100 text-blue-700 text-[10px] px-2 py-0.5 rounded-full font-bold ml-2">일반 웹 링크</span>';

            const headerHtml = `
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 pb-4 border-b border-gray-200 gap-4 sticky top-0 bg-gray-50/90 backdrop-blur-sm z-10 pt-1">
                    <div class="flex items-center gap-3">
                        <div class="w-12 h-12 rounded-xl bg-white flex items-center justify-center text-indigo-600 shadow-sm border border-gray-200">
                            <i class="fas ${category.icon} text-xl"></i>
                        </div>
                        <div>
                            <h2 class="text-xl font-bold text-gray-900 flex items-center">${escapeHtml(category.name)} ${typeBadge}</h2>
                            <p class="text-xs text-gray-500 mt-1">총 <span class="font-bold text-indigo-600">${bookmarkCount}</span>개의 정보 보관 중</p>
                        </div>
                    </div>
                    <button onclick="openBookmarkModal('${category.id}')" class="px-4 py-2 text-sm font-bold text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg shadow-sm flex items-center gap-2 cursor-pointer transition-colors">
                        <i class="fas fa-plus"></i> 스크랩 추가
                    </button>
                </div>
            `;
            
            let gridHtml = '';
            if (bookmarkCount === 0) {
                gridHtml = `<div class="text-center py-20 bg-white rounded-xl border border-dashed border-gray-300 shadow-sm"><p class="text-gray-400 mb-4 font-medium">아직 스크랩한 정보가 없습니다.</p><button onclick="openBookmarkModal('${category.id}')" class="text-indigo-600 font-bold bg-indigo-50 px-4 py-2 rounded-lg">추가하기</button></div>`;
            } else {
                const sortedBookmarks = [...category.bookmarks].sort((a, b) => (a.isPinned === b.isPinned) ? 0 : a.isPinned ? -1 : 1);
                
                if (type === 'media') {
                    gridHtml = renderMediaCards(category, sortedBookmarks);
                } else if (type === 'place') {
                    gridHtml = renderPlaceCards(category, sortedBookmarks);
                } else {
                    gridHtml = renderWebCards(category, sortedBookmarks);
                }
            }
            container.innerHTML = headerHtml + gridHtml;
        }

        // 1. 영화/책 뷰
        function renderMediaCards(category, bookmarks) {
            let html = `<div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 pb-10">`;
            bookmarks.forEach(bm => {
                const imgHtml = bm.image && bm.image !== 'null' ? `<img src="${bm.image}" class="transition-transform duration-500 group-hover:scale-105" onerror="this.src='https://placehold.co/400x600/eeeeee/999999?text=No+Poster';">` : `<div class="absolute inset-0 flex items-center justify-center bg-gray-200 text-gray-400"><i class="fas fa-film text-3xl"></i></div>`;
                const rating = bm.rating || 0;
                let starHtml = '';
                for(let i=1; i<=5; i++) { starHtml += `<i class="fas fa-star ${i<=rating ? 'text-yellow-400' : 'text-gray-300'} text-[10px]"></i>`; }
                const review = bm.review ? `"${escapeHtml(bm.review)}"` : '<span class="text-gray-300 italic">한줄평 없음</span>';

                html += `
                    <div draggable="true" ondragstart="window.handleDragStart(event, '${category.id}', '${bm.id}')" ondragend="window.handleDragEnd(event)" ondragover="window.handleCardDragOver(event)" ondragleave="window.handleCardDragLeave(event)" ondrop="window.handleCardDrop(event, '${category.id}', '${bm.id}')" class="bookmark-card bg-white border ${bm.isPinned?'border-pink-400 ring-1 ring-pink-200':'border-gray-200'} rounded-lg overflow-hidden flex flex-col relative group shadow-sm cursor-move hover:shadow-md">
                        ${bm.isPinned ? `<div class="absolute top-2 right-2 z-10 bg-pink-500 text-white w-6 h-6 rounded-full flex items-center justify-center shadow-md"><i class="fas fa-thumbtack text-[10px]"></i></div>` : ''}
                        <a href="${escapeHtml(bm.url)}" target="_blank" class="block">
                            <div class="poster-container border-b border-gray-100 bg-gray-900">${imgHtml}</div>
                        </a>
                        <div class="p-3 flex flex-col flex-grow">
                            <h3 class="font-bold text-gray-900 text-sm leading-tight line-clamp-1 mb-1" title="${escapeHtml(bm.title)}">${escapeHtml(bm.title||'제목없음')}</h3>
                            <div class="flex gap-0.5 mb-2">${starHtml}</div>
                            <p class="text-[11px] text-gray-600 line-clamp-2 leading-snug flex-grow">${review}</p>
                        </div>
                        ${renderCardFooter(category.id, bm)}
                    </div>`;
            });
            return html + `</div>`;
        }

        // 2. 장소/맛집 뷰
        function renderPlaceCards(category, bookmarks) {
            let html = `<div class="grid grid-cols-1 md:grid-cols-2 gap-4 pb-10">`;
            bookmarks.forEach(bm => {
                const imgHtml = bm.image && bm.image !== 'null' ? `<img src="${bm.image}" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/150x150/eeeeee/999999?text=Map';">` : `<div class="w-full h-full bg-emerald-100 text-emerald-500 flex items-center justify-center"><i class="fas fa-map-marked-alt text-2xl"></i></div>`;
                
                html += `
                    <div draggable="true" ondragstart="window.handleDragStart(event, '${category.id}', '${bm.id}')" ondragend="window.handleDragEnd(event)" ondragover="window.handleCardDragOver(event)" ondragleave="window.handleCardDragLeave(event)" ondrop="window.handleCardDrop(event, '${category.id}', '${bm.id}')" class="bookmark-card bg-white border ${bm.isPinned?'border-emerald-400 ring-1 ring-emerald-200':'border-gray-200'} rounded-xl overflow-hidden flex flex-col relative group shadow-sm cursor-move hover:shadow-md">
                        ${bm.isPinned ? `<div class="absolute top-2 right-2 z-10 bg-emerald-500 text-white w-6 h-6 rounded-full flex items-center justify-center shadow-md"><i class="fas fa-thumbtack text-[10px]"></i></div>` : ''}
                        <div class="flex flex-row h-28">
                            <div class="w-28 h-28 flex-shrink-0 bg-gray-100 border-r border-gray-100">${imgHtml}</div>
                            <div class="p-3 flex flex-col justify-center flex-grow min-w-0">
                                <h3 class="font-bold text-gray-900 text-base truncate mb-1 text-emerald-900">${escapeHtml(bm.title||'장소명 없음')}</h3>
                                <p class="text-xs text-gray-500 line-clamp-2 mb-2 flex items-start gap-1"><i class="fas fa-map-pin mt-0.5 text-gray-400"></i> ${escapeHtml(bm.desc||'주소/설명 없음')}</p>
                                
                                <div class="mt-auto flex justify-between items-center">
                                    <a href="${escapeHtml(bm.url)}" target="_blank" class="text-xs font-bold text-emerald-600 bg-emerald-50 px-2 py-1 rounded hover:bg-emerald-100 transition-colors flex items-center gap-1"><i class="fas fa-external-link-alt"></i> 지도 열기</a>
                                </div>
                            </div>
                        </div>
                        ${renderCardFooter(category.id, bm)}
                    </div>`;
            });
            return html + `</div>`;
        }

        // 3. 일반 웹 뷰
        function renderWebCards(category, bookmarks) {
            let html = `<div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 pb-10">`;
            bookmarks.forEach(bm => {
                const fallbackColor = stringToColor(bm.domain || bm.url);
                const fallbackInitial = (bm.domain || bm.title || "?").charAt(0).toUpperCase();
                const imgStr = bm.image && bm.image !== 'null' ? `<img src="${bm.image}" class="transition-transform duration-500 hover:scale-105" onerror="this.onerror=null; this.parentElement.innerHTML='<div class=\\'absolute inset-0 flex flex-col items-center justify-center text-white\\' style=\\'background-color:${fallbackColor}\\'> <span class=\\'text-2xl font-bold\\'>${fallbackInitial}</span></div>';">` : `<div class="absolute inset-0 flex flex-col items-center justify-center text-white" style="background-color:${fallbackColor}"> <span class="text-2xl font-bold">${fallbackInitial}</span></div>`;

                html += `
                    <div draggable="true" ondragstart="window.handleDragStart(event, '${category.id}', '${bm.id}')" ondragend="window.handleDragEnd(event)" ondragover="window.handleCardDragOver(event)" ondragleave="window.handleCardDragLeave(event)" ondrop="window.handleCardDrop(event, '${category.id}', '${bm.id}')" class="bookmark-card bg-white border ${bm.isPinned?'border-indigo-400 ring-1 ring-indigo-200':'border-gray-200'} rounded-lg overflow-hidden flex flex-col h-full relative group shadow-sm cursor-move hover:shadow-md">
                        ${bm.isPinned ? `<div class="absolute top-2 right-2 z-10 bg-indigo-600 text-white w-6 h-6 rounded-full flex items-center justify-center shadow-md"><i class="fas fa-thumbtack text-[10px]"></i></div>` : ''}
                        <a href="${escapeHtml(bm.url)}" target="_blank" class="block flex-grow focus:outline-none">
                            <div class="thumbnail-container border-b border-gray-100">${imgStr}</div>
                            <div class="p-3 flex flex-col h-[90px]">
                                <div class="flex items-center gap-1.5 mb-1.5">
                                    <img src="https://www.google.com/s2/favicons?domain=${bm.domain || new URL(bm.url).hostname}&sz=32" class="w-3.5 h-3.5 rounded-sm opacity-80" onerror="this.style.display='none'">
                                    <span class="text-[10px] text-gray-500 font-medium truncate">${escapeHtml(bm.domain)}</span>
                                </div>
                                <h3 class="font-bold text-gray-800 text-[12px] leading-snug line-clamp-2 mb-1 group-hover:text-indigo-600" title="${escapeHtml(bm.title)}">${escapeHtml(bm.title || bm.url)}</h3>
                                <p class="text-[10px] text-gray-400 line-clamp-2">${escapeHtml(bm.desc || '')}</p>
                            </div>
                        </a>
                        ${renderCardFooter(category.id, bm)}
                    </div>`;
            });
            return html + `</div>`;
        }

        // 공통 카드 푸터
        function renderCardFooter(categoryId, bm) {
            const dateStr = new Date(bm.addedAt).toLocaleDateString('ko-KR', { year: '2-digit', month: 'short', day: 'numeric' });
            return `
                <div class="px-2 py-2 bg-gray-50/80 border-t border-gray-100 flex justify-between items-center mt-auto">
                    <span class="text-[9px] text-gray-400 font-medium flex items-center gap-1"><i class="far fa-clock"></i>${dateStr}</span>
                    <div class="opacity-0 group-hover:opacity-100 transition-opacity flex gap-0.5 bg-gray-100 rounded-md">
                        <button onclick="window.togglePin(event, '${categoryId}', '${bm.id}')" class="w-6 h-6 rounded flex items-center justify-center text-gray-500 hover:text-indigo-600 hover:bg-gray-200"><i class="fas fa-thumbtack text-[10px]"></i></button>
                        <button onclick="window.openMoveModal('${categoryId}', '${bm.id}'); event.stopPropagation();" class="w-6 h-6 rounded flex items-center justify-center text-gray-500 hover:text-blue-600 hover:bg-gray-200"><i class="fas fa-exchange-alt text-[10px]"></i></button>
                        <button onclick="openBookmarkModal('${categoryId}', '${bm.id}'); event.stopPropagation();" class="w-6 h-6 rounded flex items-center justify-center text-gray-500 hover:text-green-600 hover:bg-gray-200"><i class="far fa-edit text-[10px]"></i></button>
                        <button onclick="deleteBookmark('${categoryId}', '${bm.id}'); event.stopPropagation();" class="w-6 h-6 rounded flex items-center justify-center text-gray-500 hover:text-red-600 hover:bg-red-100"><i class="far fa-trash-alt text-[10px]"></i></button>
                    </div>
                </div>`;
        }

        // --- 모달 제어 및 로직 ---
        function openCategoryModal(categoryId = null) {
            if (!window.isUserLoggedIn || !window.isUserLoggedIn()) return;
            const nameInput = document.getElementById('category-name');
            const typeRadios = document.getElementsByName('cat-type');
            
            document.getElementById('category-error').classList.add('hidden');
            
            if (categoryId) {
                const category = categories.find(c => c.id === categoryId);
                if (!category) return;
                document.getElementById('category-modal-title').textContent = '카테고리 수정';
                document.getElementById('btn-save-category').innerHTML = '<i class="fas fa-save"></i> 수정';
                document.getElementById('edit-category-id').value = categoryId;
                nameInput.value = category.name;
                document.getElementById('selected-icon').value = category.icon;
                
                const type = category.type || 'web';
                for(let r of typeRadios) { r.checked = (r.value === type); }
                
                document.querySelectorAll('.icon-btn').forEach(b => {
                    if (b.dataset.icon === category.icon) b.classList.add('bg-indigo-100', 'text-indigo-600', 'border-indigo-500');
                    else b.classList.remove('bg-indigo-100', 'text-indigo-600', 'border-indigo-500');
                });
            } else {
                document.getElementById('category-modal-title').textContent = '새 카테고리 만들기';
                document.getElementById('btn-save-category').innerHTML = '추가하기';
                document.getElementById('edit-category-id').value = '';
                nameInput.value = '';
                typeRadios[0].checked = true; // 디폴트 'web'
                const firstIconBtn = document.querySelector('.icon-btn');
                if (firstIconBtn) firstIconBtn.click();
            }
            
            const modal = document.getElementById('category-modal');
            const content = document.getElementById('category-modal-content');
            modal.classList.remove('hidden');
            setTimeout(() => { content.classList.remove('scale-95'); content.classList.add('scale-100'); nameInput.focus(); }, 10);
        }

        function closeCategoryModal() {
            const modal = document.getElementById('category-modal');
            const content = document.getElementById('category-modal-content');
            content.classList.remove('scale-100'); content.classList.add('scale-95');
            setTimeout(() => { modal.classList.add('hidden'); }, 200);
        }

        function setupIconSelector() {
            const btns = document.querySelectorAll('.icon-btn');
            btns.forEach(btn => {
                btn.addEventListener('click', function() {
                    btns.forEach(b => { b.classList.remove('bg-indigo-100', 'text-indigo-600', 'border-indigo-500'); b.classList.add('bg-gray-100', 'text-gray-600', 'border-transparent'); });
                    this.classList.remove('bg-gray-100', 'text-gray-600', 'border-transparent'); this.classList.add('bg-indigo-100', 'text-indigo-600', 'border-indigo-500');
                    document.getElementById('selected-icon').value = this.dataset.icon;
                });
            });
        }

        function saveCategory() {
            const name = document.getElementById('category-name').value.trim();
            const icon = document.getElementById('selected-icon').value;
            const editId = document.getElementById('edit-category-id').value;
            let type = 'web';
            const typeRadios = document.getElementsByName('cat-type');
            for(let r of typeRadios) { if(r.checked) type = r.value; }

            if (!name) { document.getElementById('category-error').classList.remove('hidden'); return; }

            if (editId) {
                const idx = categories.findIndex(c => c.id === editId);
                if (idx > -1) {
                    categories[idx].name = name; categories[idx].icon = icon; categories[idx].type = type; categories[idx].updatedAt = Date.now();
                    showToast('카테고리가 수정되었습니다.', 'success');
                }
            } else {
                categories.push({ id: generateId(), name: name, icon: icon, type: type, bookmarks: [], createdAt: Date.now(), updatedAt: Date.now() });
                selectedCategoryId = categories[categories.length - 1].id;
                showToast('카테고리가 추가되었습니다.', 'success');
            }
            saveData(); closeCategoryModal();
        }

        let currentMetadata = null;

        function openBookmarkModal(categoryId, bookmarkId = null) {
            if (!window.isUserLoggedIn || !window.isUserLoggedIn()) return;
            document.getElementById('target-category-id').value = categoryId;
            document.getElementById('edit-bookmark-id').value = bookmarkId || '';
            document.getElementById('url-error').classList.add('hidden');
            
            const category = categories.find(c => c.id === categoryId);
            const type = category ? (category.type || 'web') : 'web';
            document.getElementById('current-cat-type').value = type;

            const titleLabel = document.getElementById('title-label');
            const descLabel = document.getElementById('desc-label');
            const urlLabel = document.getElementById('url-label');
            const mediaFields = document.getElementById('media-extra-fields');
            
            if(type === 'place') {
                titleLabel.textContent = '장소/가게 이름'; descLabel.textContent = '상세 주소 또는 설명'; urlLabel.innerHTML = '지도 링크(네이버/구글맵 URL) <span class="text-red-500">*</span>';
                mediaFields.classList.add('hidden');
            } else if(type === 'media') {
                titleLabel.textContent = '작품 제목'; descLabel.textContent = '작가/감독/설명'; urlLabel.innerHTML = '작품 정보 링크 <span class="text-red-500">*</span>';
                mediaFields.classList.remove('hidden');
            } else {
                titleLabel.textContent = '웹페이지 제목'; descLabel.textContent = '설명 (선택)'; urlLabel.innerHTML = 'URL 주소 <span class="text-red-500">*</span>';
                mediaFields.classList.add('hidden');
            }
            
            if (bookmarkId) {
                document.getElementById('bookmark-modal-title').textContent = '정보 수정';
                const bookmark = category.bookmarks.find(b => b.id === bookmarkId);
                document.getElementById('bookmark-url').value = bookmark.url;
                document.getElementById('bookmark-title').value = bookmark.title;
                document.getElementById('bookmark-desc').value = bookmark.desc;
                
                if(type === 'media') {
                    updateStarUI(bookmark.rating || 0);
                    document.getElementById('bookmark-rating').value = bookmark.rating || 0;
                    document.getElementById('bookmark-review').value = bookmark.review || '';
                }

                currentMetadata = { title: bookmark.title, description: bookmark.desc, image: bookmark.image, domain: bookmark.domain };
                if (bookmark.image && bookmark.image !== 'null') document.getElementById('preview-img').src = bookmark.image;
                document.getElementById('preview-area').classList.remove('hidden');
            } else {
                document.getElementById('bookmark-modal-title').textContent = '새 정보 스크랩';
                document.getElementById('bookmark-url').value = ''; document.getElementById('bookmark-title').value = ''; document.getElementById('bookmark-desc').value = '';
                if(type === 'media') { updateStarUI(0); document.getElementById('bookmark-rating').value = 0; document.getElementById('bookmark-review').value = ''; }
                document.getElementById('preview-area').classList.add('hidden');
                currentMetadata = null;

                if(document.getElementById('web-search-input').value.trim() === '') {
                    setTimeout(async () => {
                        try {
                            if (navigator.clipboard && navigator.clipboard.readText) {
                                const text = await navigator.clipboard.readText();
                                if (isValidUrl(text)) {
                                    document.getElementById('bookmark-url').value = text;
                                    fetchMetadata(text); 
                                }
                            }
                        } catch (err) {}
                    }, 100);
                }
            }
            
            const modal = document.getElementById('bookmark-modal');
            const content = document.getElementById('bookmark-modal-content');
            modal.classList.remove('hidden');
            setTimeout(() => { content.classList.remove('scale-95'); content.classList.add('scale-100'); }, 10);
        }

        function closeBookmarkModal() {
            const modal = document.getElementById('bookmark-modal');
            const content = document.getElementById('bookmark-modal-content');
            content.classList.remove('scale-100'); content.classList.add('scale-95');
            setTimeout(() => { modal.classList.add('hidden'); }, 200);
        }

        async function fetchMetadata(url) {
            if (!url) return;
            if (!/^https?:\/\//i.test(url)) { url = 'http://' + url; document.getElementById('bookmark-url').value = url; }
            if (!isValidUrl(url)) { document.getElementById('url-error').classList.remove('hidden'); return; }
            document.getElementById('url-error').classList.add('hidden');
            
            document.getElementById('loading-indicator').classList.remove('hidden');
            document.getElementById('preview-area').classList.add('hidden');
            
            try {
                const response = await fetch(`https://api.microlink.io?url=${encodeURIComponent(url)}`);
                const data = await response.json();
                if (data.status === 'success') {
                    const result = data.data;
                    currentMetadata = { title: result.title || '', description: result.description || '', image: result.image?.url || '', domain: new URL(url).hostname.replace('www.', '') };
                    
                    if (!document.getElementById('bookmark-title').value) document.getElementById('bookmark-title').value = currentMetadata.title;
                    if (!document.getElementById('bookmark-desc').value) document.getElementById('bookmark-desc').value = currentMetadata.description;
                    
                    if (currentMetadata.image) document.getElementById('preview-img').src = currentMetadata.image;
                    document.getElementById('preview-title').textContent = currentMetadata.title || url;
                    document.getElementById('preview-domain').textContent = currentMetadata.domain;
                    document.getElementById('preview-area').classList.remove('hidden');
                }
            } catch (error) {
                currentMetadata = { title: '', description: '', image: '', domain: new URL(url).hostname.replace('www.', '') };
            } finally {
                document.getElementById('loading-indicator').classList.add('hidden');
            }
        }

        function saveBookmark() {
            const categoryId = document.getElementById('target-category-id').value;
            const editBookmarkId = document.getElementById('edit-bookmark-id').value;
            const type = document.getElementById('current-cat-type').value;
            let url = document.getElementById('bookmark-url').value.trim();
            const title = document.getElementById('bookmark-title').value.trim();
            const desc = document.getElementById('bookmark-desc').value.trim();
            
            if (!url || !isValidUrl(url)) { document.getElementById('url-error').classList.remove('hidden'); return; }

            const catIdx = categories.findIndex(c => c.id === categoryId);
            if (catIdx === -1) return;

            let domain = ""; try { domain = new URL(url).hostname.replace('www.', ''); } catch(e) {}
            
            let rating = 0; let review = '';
            if(type === 'media') {
                rating = parseInt(document.getElementById('bookmark-rating').value) || 0;
                review = document.getElementById('bookmark-review').value.trim();
            }

            const newBmData = {
                url: url,
                title: title || (currentMetadata && currentMetadata.title) || domain,
                desc: desc || (currentMetadata && currentMetadata.description) || '',
                image: (currentMetadata && currentMetadata.image) || '',
                domain: domain,
                rating: rating,
                review: review
            };

            if (editBookmarkId) {
                const bmIdx = categories[catIdx].bookmarks.findIndex(b => b.id === editBookmarkId);
                if (bmIdx > -1) {
                    newBmData.image = (currentMetadata && currentMetadata.image !== undefined) ? currentMetadata.image : categories[catIdx].bookmarks[bmIdx].image;
                    categories[catIdx].bookmarks[bmIdx] = { ...categories[catIdx].bookmarks[bmIdx], ...newBmData };
                }
            } else {
                newBmData.id = generateId();
                newBmData.addedAt = Date.now();
                newBmData.isPinned = false;
                categories[catIdx].bookmarks.unshift(newBmData);
            }
            categories[catIdx].updatedAt = Date.now();
            showToast('저장되었습니다.', 'success');
            saveData(); closeBookmarkModal();
        }

        function deleteBookmark(categoryId, bookmarkId) {
            const idx = categories.findIndex(c => c.id === categoryId);
            if (idx === -1) return;
            showConfirm("삭제", "정말 삭제하시겠습니까?", () => {
                categories[idx].bookmarks = categories[idx].bookmarks.filter(b => b.id !== bookmarkId);
                categories[idx].updatedAt = Date.now(); saveData();
            });
        }

        // 이동 모달 로직
        window.openMoveModal = function(categoryId, bookmarkId) {
            const selectEl = document.getElementById('move-target-category');
            selectEl.innerHTML = '';
            categories.forEach(cat => { if(cat.id !== categoryId) selectEl.innerHTML += `<option value="${cat.id}">${cat.name}</option>`; });
            if(selectEl.options.length === 0) { showToast('이동할 카테고리가 없습니다.', 'warning'); return; }
            document.getElementById('move-source-cat-id').value = categoryId; document.getElementById('move-target-bm-id').value = bookmarkId;
            const modal = document.getElementById('move-modal'); const content = document.getElementById('move-modal-content');
            modal.classList.remove('hidden'); setTimeout(() => { content.classList.remove('scale-95'); content.classList.add('scale-100'); }, 10);
        };
        window.closeMoveModal = function() {
            const modal = document.getElementById('move-modal'); const content = document.getElementById('move-modal-content');
            content.classList.remove('scale-100'); content.classList.add('scale-95'); setTimeout(() => { modal.classList.add('hidden'); }, 200);
        };
        window.executeMoveBookmark = function() {
            const sourceId = document.getElementById('move-source-cat-id').value;
            const bmId = document.getElementById('move-target-bm-id').value;
            const targetId = document.getElementById('move-target-category').value;
            const sourceCat = categories.find(c => c.id === sourceId); const targetCat = categories.find(c => c.id === targetId);
            if(sourceCat && targetCat) {
                const bmIndex = sourceCat.bookmarks.findIndex(b => b.id === bmId);
                if(bmIndex > -1) {
                    const bm = sourceCat.bookmarks.splice(bmIndex, 1)[0];
                    targetCat.bookmarks.unshift(bm);
                    sourceCat.updatedAt = Date.now(); targetCat.updatedAt = Date.now();
                    saveData(); window.closeMoveModal(); showToast('이동되었습니다.', 'success');
                }
            }
        };

        // 삭제 확인 모달 공통 로직
        function showConfirm(title, desc, onConfirm) {
            const modal = document.getElementById('confirm-modal');
            const content = document.getElementById('confirm-modal-content');
            document.getElementById('confirm-modal-title').textContent = title;
            document.getElementById('confirm-modal-desc').textContent = desc;
            const close = () => { content.classList.remove('scale-100'); content.classList.add('scale-95'); setTimeout(() => { modal.classList.add('hidden'); }, 200); };
            document.getElementById('confirm-ok-btn').onclick = () => { close(); onConfirm(); };
            document.getElementById('confirm-cancel-btn').onclick = close;
            modal.classList.remove('hidden'); setTimeout(() => { content.classList.remove('scale-95'); content.classList.add('scale-100'); }, 10);
        }
        function deleteCategory(id) { showConfirm("카테고리 삭제", "모든 내용이 삭제됩니다.", () => { categories = categories.filter(cat => cat.id !== id); if(selectedCategoryId === id) selectedCategoryId = null; saveData(); }); }

        // 유틸리티
        function isValidUrl(s) { try { new URL(s); return true; } catch (_) { return false; } }
        function escapeHtml(s) { return s?s.toString().replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;"):''; }
        function stringToColor(str) { let h=0,c='#'; for(let i=0;i<str.length;i++) h=str.charCodeAt(i)+((h<<5)-h); for(let i=0;i<3;i++) c+=('00'+Math.max(50,Math.min(200,(h>>(i*8))&0xFF)).toString(16)).substr(-2); return c; }
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container'); const toast = document.createElement('div');
            const icon = type==='success'?'fa-check-circle text-green-400':(type==='warning'?'fa-exclamation-triangle text-yellow-400':'fa-times-circle text-red-400');
            toast.className = `flex items-center gap-3 px-4 py-3 rounded-lg shadow-lg text-white text-sm transform transition-all duration-300 translate-y-10 opacity-0 bg-gray-800`;
            toast.innerHTML = `<i class="fas ${icon} text-lg"></i><span class="font-medium">${escapeHtml(message)}</span>`;
            container.appendChild(toast); requestAnimationFrame(() => { toast.classList.remove('translate-y-10', 'opacity-0'); toast.classList.add('translate-y-0', 'opacity-100'); });
            setTimeout(() => { toast.classList.remove('translate-y-0', 'opacity-100'); toast.classList.add('translate-y-2', 'opacity-0'); setTimeout(() => container.removeChild(toast), 300); }, 3000);
        }

        // 데이터 관리
        window.openDataModal = () => { document.getElementById('data-modal').classList.remove('hidden'); setTimeout(() => document.getElementById('data-modal-content').classList.replace('scale-95','scale-100'), 10); };
        window.closeDataModal = () => { document.getElementById('data-modal-content').classList.replace('scale-100','scale-95'); setTimeout(() => document.getElementById('data-modal').classList.add('hidden'), 200); };
        window.exportDataToJson = () => {
            const a = document.createElement('a'); a.href = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(categories, null, 2)); a.download = "scrapbook_backup.json";
            document.body.appendChild(a); a.click(); a.remove(); showToast('백업 완료');
        };
        window.importDataFromJson = (e) => {
            const r = new FileReader(); r.onload = (e) => { try { categories = JSON.parse(e.target.result); saveData(); window.closeDataModal(); showToast('복원 완료'); } catch(err){ showToast('파일 오류', 'error'); }};
            if(e.target.files[0]) r.readAsText(e.target.files[0]);
        };
    </script>

    <!-- Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        let db, auth, currentUser;
        let unsubscribeSnapshot = null;

        const defaultFirebaseConfig = {
            apiKey: "AIzaSyBFSckLj-kSpOx7ZlD9YPYLeK5y8BPHTX4",
            authDomain: "bookmark-dashboard-345cc.firebaseapp.com",
            projectId: "bookmark-dashboard-345cc",
            storageBucket: "bookmark-dashboard-345cc.firebasestorage.app",
            messagingSenderId: "1064431939109",
            appId: "1:1064431939109:web:a867509734c203952719cc"
        };

        async function initFirebase() {
            try {
                const app = initializeApp(defaultFirebaseConfig);
                auth = getAuth(app); db = getFirestore(app);
                onAuthStateChanged(auth, (user) => {
                    currentUser = user; updateAuthUI(user);
                    if (user) listenToCloudChanges(user.uid);
                    else { if (unsubscribeSnapshot) unsubscribeSnapshot(); clearUserData(); updateCloudSyncStatus('disconnected'); }
                });
            } catch (error) { updateCloudSyncStatus('error', error.message); }
        }

        function isUserLoggedIn() { return !!currentUser; }

        function updateAuthUI(user) {
            const authSection = document.getElementById('auth-section');
            if (user) {
                authSection.innerHTML = `<div class="flex items-center gap-2 bg-indigo-50 border border-indigo-100 rounded-lg px-2.5 py-1.5"><img src="${user.photoURL}" class="w-6 h-6 rounded-full" onerror="this.style.display='none'"><span class="text-xs font-bold text-indigo-900 truncate max-w-[120px]">${escapeHtml(user.displayName || user.email)}</span><button onclick="window.handleGoogleLogout()" class="ml-1 text-xs text-red-500 hover:underline">로그아웃</button></div>`;
                updateCloudSyncStatus('connected', user.displayName);
            } else {
                authSection.innerHTML = `<button onclick="window.handleGoogleLogin()" class="px-3 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm font-bold shadow-sm"><i class="fab fa-google"></i> 구글 로그인</button>`;
            }
        }

        function updateCloudSyncStatus(status, extra='') {
            const el = document.getElementById('cloud-sync-status'); if(!el) return;
            if(status === 'connected') el.innerHTML = `<span class="relative flex h-3 w-3"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span><span class="relative inline-flex rounded-full h-3 w-3 bg-green-500"></span></span><span class="text-green-700 font-bold">동기화 중 (${escapeHtml(extra)})</span>`;
            else el.innerHTML = `<span class="relative flex h-3 w-3"><span class="relative inline-flex rounded-full h-3 w-3 bg-yellow-500"></span></span><span class="text-yellow-700 font-bold">로그인 필요</span>`;
        }

        async function handleGoogleLogin() {
            try { 
                await signInWithPopup(auth, new GoogleAuthProvider()); 
            } catch (error) { 
                if (error.code !== 'auth/popup-closed-by-user') {
                    console.error("로그인 상세 에러:", error);
                    // 상세 에러 안내 처리
                    if (error.code === 'auth/unauthorized-domain') {
                        showToast(`로그인 실패: 등록되지 않은 도메인입니다. 파이어베이스 콘솔에 현재 접속 주소를 추가해주세요.`, 'error');
                    } else if (error.code === 'auth/api-key-not-valid') {
                        showToast(`로그인 실패: API Key가 유효하지 않습니다. 코드 설정을 다시 확인해주세요.`, 'error');
                    } else {
                        showToast(`로그인 실패: ${error.message}`, 'error');
                    }
                }
            }
        }
        
        async function handleGoogleLogout() { try { await signOut(auth); showToast('로그아웃 됨', 'info'); } catch (error) {} }

        function listenToCloudChanges(userId) {
            if (!db) return;
            unsubscribeSnapshot = onSnapshot(doc(db, "users", userId), (docSnap) => {
                if (docSnap.exists()) {
                    const cloudData = docSnap.data().categories;
                    if (cloudData && Array.isArray(cloudData)) { categories = cloudData; localStorage.setItem(STORAGE_KEY, JSON.stringify(categories)); renderLayout(); }
                } else saveToCloud();
            });
        }

        async function saveToCloud() {
            if (!currentUser || !db) return;
            try { await setDoc(doc(db, "users", currentUser.uid), { categories: categories, updatedAt: Date.now() }, { merge: true }); } catch (error) {}
        }

        window.handleGoogleLogin = handleGoogleLogin; window.handleGoogleLogout = handleGoogleLogout; window.saveToCloud = saveToCloud; window.isUserLoggedIn = isUserLoggedIn;
        initFirebase();
    </script>
