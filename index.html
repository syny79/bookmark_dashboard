<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내 즐겨찾기 대시보드</title>
    
    <!-- Tailwind CSS 및 FontAwesome 아이콘 로드 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <!-- 모바일 터치 환경에서의 HTML5 Drag & Drop 지원을 위한 Polyfill -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/mobile-drag-drop@2.3.0-rc.2/default.css">
    <script src="https://cdn.jsdelivr.net/npm/mobile-drag-drop@2.3.0-rc.2/index.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mobile-drag-drop@2.3.0-rc.2/scroll-behaviour.min.js"></script>
    
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --bg-color: #F3F4F6;
            --card-bg: #FFFFFF;
            --text-main: #1F2937;
            --text-muted: #6B7280;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            /* 모바일 드래그 시 화면 튕김 방지 */
            overscroll-behavior-y: none;
        }

        .thumbnail-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
            overflow: hidden;
            background-color: #e5e7eb;
            border-radius: 0.5rem 0.5rem 0 0;
        }

        .thumbnail-container img, .thumbnail-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            border: none;
        }
        
        .bookmark-card {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        /* 사이드바 카테고리 Drag & Drop Visuals */
        .drag-over {
            background-color: #EEF2FF !important; 
            border: 2px dashed #818CF8 !important; 
        }
        
        /* 카드 간 Reordering Drag & Drop Visuals */
        .card-drag-over {
            opacity: 0.5;
            transform: scale(0.98);
            border-color: #6366f1 !important;
            box-shadow: inset 0 0 0 2px #6366f1;
        }

        /* 고정 핀 톡톡 튀는 애니메이션 정의 */
        @keyframes pin-bounce {
            0% { transform: scale(1); }
            40% { transform: scale(1.5) rotate(-20deg); color: #4F46E5; }
            70% { transform: scale(1.5) rotate(20deg); color: #4F46E5; }
            100% { transform: scale(1); }
        }
        .pin-animating i {
            animation: pin-bounce 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-gray-50">

    <header class="bg-white shadow-sm sticky top-0 z-30 border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-indigo-600 rounded-lg flex items-center justify-center text-white shadow-md">
                    <i class="fas fa-bookmark text-xl"></i>
                </div>
                <h1 class="text-xl sm:text-2xl font-bold text-gray-900 tracking-tight">Bookmarks Dashboard</h1>
            </div>
            
            <div class="flex items-center gap-2 sm:gap-4">
                <div id="auth-section" class="flex items-center gap-2">
                    <button onclick="window.handleGoogleLogin()" class="px-3 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs sm:text-sm font-bold transition-all shadow-sm flex items-center gap-2 cursor-pointer">
                        <i class="fab fa-google"></i> 구글 로그인
                    </button>
                </div>
                <button onclick="window.openDataModal()" class="px-3 py-2 text-gray-600 hover:text-indigo-600 hover:bg-indigo-50 rounded-lg transition-colors flex items-center gap-2 border border-transparent hover:border-indigo-100 shadow-sm cursor-pointer" title="데이터 관리 및 백업">
                    <i class="fas fa-cloud text-lg"></i> <span class="hidden sm:inline text-sm font-bold">데이터 관리</span>
                </button>
            </div>
        </div>
    </header>

    <div class="flex-grow max-w-7xl mx-auto w-full flex flex-col md:flex-row px-4 sm:px-6 lg:px-8 py-6 gap-6 h-[calc(100vh-73px)]">
        
        <aside class="w-full md:w-64 flex-shrink-0 bg-white rounded-xl shadow-sm border border-gray-100 flex flex-col h-64 md:h-full overflow-hidden">
            <div class="p-4 border-b border-gray-50">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="font-bold text-gray-800 text-sm">내 카테고리</h2>
                    <select id="sort-select" onchange="changeSort(this.value)" class="text-xs border-gray-200 bg-gray-50 text-gray-600 rounded-md py-1 px-2 focus:ring-1 focus:ring-indigo-500 cursor-pointer outline-none">
                        <option value="updatedAt_desc">최근 수정순</option>
                        <option value="updatedAt_asc">오래된 수정순</option>
                        <option value="createdAt_desc">최신 생성순</option>
                        <option value="createdAt_asc">오래된 생성순</option>
                        <option value="name_asc">이름순 (ㄱ-ㅎ)</option>
                        <option value="name_desc">이름순 (ㅎ-ㄱ)</option>
                    </select>
                </div>
                
                <button onclick="openCategoryModal()" class="w-full py-2 bg-indigo-50 text-indigo-600 rounded-lg text-sm font-bold hover:bg-indigo-100 transition-colors flex items-center justify-center gap-2 border border-indigo-100 cursor-pointer">
                    <i class="fas fa-plus"></i> 새 카테고리
                </button>
            </div>

            <div id="sidebar-category-list" class="flex-grow overflow-y-auto p-2 space-y-1 hide-scrollbar">
                <!-- 동적 카테고리 항목 -->
            </div>
        </aside>

        <main class="flex-1 min-w-0 bg-white rounded-xl shadow-sm border border-gray-100 flex flex-col h-full overflow-hidden relative">
            
            <!-- 상단 웹 검색 영역 (추가됨) -->
            <div id="search-section" class="hidden p-4 border-b border-gray-100 bg-gray-50 flex flex-col sm:flex-row gap-2">
                <div class="flex flex-grow shadow-sm rounded-lg overflow-hidden border border-gray-300 focus-within:ring-2 focus-within:ring-indigo-500 focus-within:border-indigo-500 transition-shadow bg-white">
                    <select id="search-engine" class="px-3 py-2 bg-gray-100 border-r border-gray-300 text-sm font-medium text-gray-700 outline-none cursor-pointer hover:bg-gray-200">
                        <option value="google">Google</option>
                        <option value="naver">Naver</option>
                    </select>
                    <input type="text" id="web-search-input" placeholder="웹 검색..." class="w-full px-4 py-2 outline-none text-sm" onkeypress="if(event.key === 'Enter') executeWebSearch()">
                    <button onclick="executeWebSearch()" class="px-4 py-2 text-gray-500 hover:text-indigo-600 hover:bg-gray-100 transition-colors flex items-center justify-center cursor-pointer" title="검색하기">
                        <i class="fas fa-search"></i>
                    </button>
                </div>
                <button onclick="saveSearchAsBookmark()" class="flex-shrink-0 px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-bold rounded-lg shadow-sm transition-colors flex items-center gap-2 cursor-pointer" title="현재 검색어를 즐겨찾기로 저장">
                    <i class="fas fa-star"></i> 저장
                </button>
            </div>

            <div id="empty-state" class="hidden h-full flex-col items-center justify-center p-8 text-center bg-gray-50">
                <div class="w-20 h-20 bg-white shadow-sm rounded-full flex items-center justify-center mb-4 border border-gray-100">
                    <i class="fas fa-folder-open text-3xl text-gray-400"></i>
                </div>
                <h2 id="empty-state-title" class="text-lg font-bold text-gray-700 mb-2">구글 로그인이 필요합니다</h2>
                <p id="empty-state-desc" class="text-gray-500 text-sm mb-6 max-w-sm">상단의 [구글 로그인] 버튼을 눌러 로그인하시면<br>저장된 즐겨찾기를 불러올 수 있습니다.</p>
                <button onclick="window.handleGoogleLogin()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm font-bold transition-all shadow-md flex items-center gap-2 cursor-pointer">
                    <i class="fab fa-google"></i> 구글 로그인하기
                </button>
            </div>

            <div id="dashboard-content" class="flex-1 overflow-y-auto p-4 sm:p-6 hide-scrollbar relative">
                <!-- 북마크 컨텐츠 추가 위치 -->
            </div>
        </main>
    </div>

    <!-- 새 카테고리 모달 -->
    <div id="category-modal" class="fixed inset-0 bg-gray-900 bg-opacity-50 modal-backdrop hidden flex items-center justify-center z-50 transition-opacity">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-md mx-4 transform scale-95 transition-transform duration-200" id="category-modal-content">
            <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center">
                <h3 class="text-lg font-bold text-gray-900" id="category-modal-title">새 카테고리 만들기</h3>
                <button onclick="closeCategoryModal()" class="text-gray-400 hover:text-gray-600 focus:outline-none">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            <div class="p-6">
                <input type="hidden" id="edit-category-id">
                <div class="mb-5">
                    <label for="category-name" class="block text-sm font-medium text-gray-700 mb-2">카테고리 이름</label>
                    <input type="text" id="category-name" placeholder="예: 업무용, 디자인 레퍼런스, 뉴스" 
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none"
                           onkeypress="if(event.key === 'Enter') saveCategory()">
                    <p id="category-error" class="text-red-500 text-xs mt-2 hidden">카테고리 이름을 입력해주세요.</p>
                </div>
                <div class="flex gap-2">
                    <button class="icon-btn w-10 h-10 rounded bg-indigo-100 text-indigo-600 border-2 border-indigo-500 flex items-center justify-center" data-icon="fa-folder"><i class="fas fa-folder"></i></button>
                    <button class="icon-btn w-10 h-10 rounded bg-gray-100 text-gray-600 border-2 border-transparent hover:bg-gray-200 flex items-center justify-center" data-icon="fa-briefcase"><i class="fas fa-briefcase"></i></button>
                    <button class="icon-btn w-10 h-10 rounded bg-gray-100 text-gray-600 border-2 border-transparent hover:bg-gray-200 flex items-center justify-center" data-icon="fa-laptop-code"><i class="fas fa-laptop-code"></i></button>
                    <button class="icon-btn w-10 h-10 rounded bg-gray-100 text-gray-600 border-2 border-transparent hover:bg-gray-200 flex items-center justify-center" data-icon="fa-palette"><i class="fas fa-palette"></i></button>
                    <button class="icon-btn w-10 h-10 rounded bg-gray-100 text-gray-600 border-2 border-transparent hover:bg-gray-200 flex items-center justify-center" data-icon="fa-star"><i class="fas fa-star"></i></button>
                    <button class="icon-btn w-10 h-10 rounded bg-gray-100 text-gray-600 border-2 border-transparent hover:bg-gray-200 flex items-center justify-center" data-icon="fa-heart"><i class="fas fa-heart"></i></button>
                    <button class="icon-btn w-10 h-10 rounded bg-gray-100 text-gray-600 border-2 border-transparent hover:bg-gray-200 flex items-center justify-center" data-icon="fa-gamepad"><i class="fas fa-gamepad"></i></button>
                </div>
                <input type="hidden" id="selected-icon" value="fa-folder">
            </div>
            <div class="px-6 py-4 bg-gray-50 rounded-b-xl border-t border-gray-100 flex justify-end gap-3">
                <button onclick="closeCategoryModal()" class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 focus:outline-none">취소</button>
                <button onclick="saveCategory()" id="btn-save-category" class="px-4 py-2 text-sm font-medium text-white bg-indigo-600 rounded-lg hover:bg-indigo-700 focus:outline-none shadow-sm">추가하기</button>
            </div>
        </div>
    </div>

    <!-- 링크 이동 팝업 모달 -->
    <div id="move-modal" class="fixed inset-0 bg-gray-900 bg-opacity-50 modal-backdrop hidden flex items-center justify-center z-50 transition-opacity">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-sm mx-4 transform scale-95 transition-transform duration-200" id="move-modal-content">
            <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center">
                <h3 class="text-lg font-bold text-gray-900">다른 카테고리로 이동</h3>
                <button onclick="window.closeMoveModal()" class="text-gray-400 hover:text-gray-600 focus:outline-none">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            <div class="p-6">
                <input type="hidden" id="move-source-cat-id">
                <input type="hidden" id="move-target-bm-id">
                <label for="move-target-category" class="block text-sm font-medium text-gray-700 mb-2">이동할 목적지 선택</label>
                <select id="move-target-category" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                </select>
            </div>
            <div class="px-6 py-4 bg-gray-50 rounded-b-xl border-t border-gray-100 flex justify-end gap-3">
                <button onclick="window.closeMoveModal()" class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50">취소</button>
                <button onclick="window.executeMoveBookmark()" class="px-4 py-2 text-sm font-medium text-white bg-indigo-600 rounded-lg hover:bg-indigo-700 shadow-sm">이동하기</button>
            </div>
        </div>
    </div>

    <!-- 새 북마크 추가 모달 -->
    <div id="bookmark-modal" class="fixed inset-0 bg-gray-900 bg-opacity-50 modal-backdrop hidden flex items-center justify-center z-50 transition-opacity">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-md mx-4 transform scale-95 transition-transform duration-200" id="bookmark-modal-content">
            <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center">
                <h3 class="text-lg font-bold text-gray-900" id="bookmark-modal-title">새 북마크 추가</h3>
                <button onclick="closeBookmarkModal()" class="text-gray-400 hover:text-gray-600 focus:outline-none">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            <div class="p-6 space-y-4">
                <input type="hidden" id="target-category-id">
                <input type="hidden" id="edit-bookmark-id">
                
                <div>
                    <label for="bookmark-url" class="block text-sm font-medium text-gray-700 mb-1">URL 주소 <span class="text-red-500">*</span></label>
                    <input type="url" id="bookmark-url" placeholder="https://example.com" 
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none"
                           onblur="fetchMetadata(this.value)">
                    <p id="url-error" class="text-red-500 text-xs mt-1 hidden">유효한 URL을 입력해주세요 (http:// 또는 https:// 포함).</p>
                </div>
                <div>
                    <label for="bookmark-title" class="block text-sm font-medium text-gray-700 mb-1">제목 (선택사항)</label>
                    <input type="text" id="bookmark-title" placeholder="자동으로 가져옵니다" 
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div>
                    <label for="bookmark-desc" class="block text-sm font-medium text-gray-700 mb-1">설명 (선택사항)</label>
                    <textarea id="bookmark-desc" rows="2" placeholder="자동으로 가져옵니다" 
                              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none resize-none"></textarea>
                </div>
                
                <div id="preview-area" class="hidden mt-4 border border-gray-200 rounded-lg p-2 bg-gray-50">
                    <p class="text-xs text-gray-500 mb-2 font-semibold">미리보기</p>
                    <div class="flex gap-3">
                        <div class="w-20 h-20 bg-gray-200 rounded overflow-hidden flex-shrink-0">
                            <img id="preview-img" src="" alt="preview" class="w-full h-full object-cover">
                        </div>
                        <div class="overflow-hidden flex flex-col justify-center">
                            <p id="preview-title" class="text-sm font-bold text-gray-800 truncate"></p>
                            <p id="preview-domain" class="text-xs text-gray-500 truncate mt-1"></p>
                        </div>
                    </div>
                </div>

                <div id="loading-indicator" class="hidden flex items-center justify-center py-4">
                    <i class="fas fa-spinner fa-spin text-indigo-500 text-2xl"></i>
                    <span class="ml-2 text-sm text-gray-600">페이지 정보 가져오는 중...</span>
                </div>
            </div>
            
            <div class="px-6 py-4 bg-gray-50 rounded-b-xl border-t border-gray-100 flex justify-end gap-3">
                <button onclick="closeBookmarkModal()" class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50">취소</button>
                <button id="btn-save-bookmark" onclick="saveBookmark()" class="px-4 py-2 text-sm font-medium text-white bg-indigo-600 rounded-lg hover:bg-indigo-700 shadow-sm">
                    <span id="btn-save-text"><i class="fas fa-save"></i> 저장하기</span>
                </button>
            </div>
        </div>
    </div>
    
    <!-- 데이터 관리 모달 -->
    <div id="data-modal" class="fixed inset-0 bg-gray-900 bg-opacity-50 modal-backdrop hidden flex items-center justify-center z-50 transition-opacity">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-md mx-4 transform scale-95 transition-transform duration-200" id="data-modal-content">
            <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center">
                <h3 class="text-lg font-bold text-gray-900">데이터 관리 및 백업</h3>
                <button onclick="window.closeDataModal()" class="text-gray-400 hover:text-gray-600 focus:outline-none">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            <div class="p-6 space-y-6">
                <div class="bg-gray-50 rounded-lg p-4 border border-gray-200">
                    <h4 class="text-sm font-bold text-gray-700 mb-2 flex items-center gap-2">
                        <i class="fas fa-cloud"></i> 클라우드 동기화 상태
                    </h4>
                    <div id="cloud-sync-status" class="flex items-center gap-2 text-sm text-gray-600">
                        연결 확인 중...
                    </div>
                </div>

                <div>
                    <h4 class="text-sm font-bold text-gray-700 mb-3 flex items-center gap-2">
                        <i class="fas fa-save"></i> 수동 백업 및 복구
                    </h4>
                    <div class="grid grid-cols-2 gap-3">
                        <button onclick="window.exportDataToJson()" class="flex flex-col items-center justify-center p-4 rounded-lg border-2 border-indigo-100 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 cursor-pointer">
                            <i class="fas fa-file-download text-2xl mb-2"></i>
                            <span class="text-sm font-bold">데이터 내보내기</span>
                        </button>
                        
                        <label for="import-file" class="flex flex-col items-center justify-center p-4 rounded-lg border-2 border-gray-200 bg-white hover:bg-gray-50 text-gray-700 cursor-pointer">
                            <i class="fas fa-file-upload text-2xl mb-2"></i>
                            <span class="text-sm font-bold">데이터 불러오기</span>
                            <input type="file" id="import-file" accept=".json" class="hidden" onchange="window.importDataFromJson(event)">
                        </label>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 삭제 확인 모달 -->
    <div id="confirm-modal" class="fixed inset-0 bg-gray-900 bg-opacity-50 modal-backdrop hidden flex items-center justify-center z-50 transition-opacity">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-sm mx-4 p-6 text-center transform scale-95 transition-transform duration-200" id="confirm-modal-content">
            <div class="w-12 h-12 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto mb-4">
                <i class="fas fa-exclamation-triangle text-xl"></i>
            </div>
            <h3 id="confirm-modal-title" class="text-base font-bold text-gray-900 mb-2">정말 삭제하시겠습니까?</h3>
            <p id="confirm-modal-desc" class="text-xs text-gray-500 mb-6 leading-relaxed">이 작업은 취소할 수 없습니다.</p>
            <div class="flex gap-3 justify-center">
                <button id="confirm-cancel-btn" class="px-4 py-2 text-xs font-medium text-gray-700 bg-gray-100 hover:bg-gray-200 rounded-lg cursor-pointer">취소</button>
                <button id="confirm-ok-btn" class="px-4 py-2 text-xs font-medium text-white bg-red-600 hover:bg-red-700 rounded-lg cursor-pointer">삭제</button>
            </div>
        </div>
    </div>

    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <script>
        let categories = [];
        let selectedCategoryId = null;
        let currentSortMode = 'updatedAt_desc';
        const STORAGE_KEY = 'bookmark_dashboard_data';

        // 모바일 터치 기반 HTML5 Drag&Drop 활성화 폴리필 설정
        window.addEventListener('load', function() {
            MobileDragDrop.polyfill({
                holdToDrag: 250, // 모바일에서 드래그 시작 전 0.25초간 길게 누름(스크롤 오작동 방지)
                dragImageTranslateOverride: MobileDragDrop.scrollBehaviourDragImageTranslateOverride
            });
            // iOS Safari 스크롤 이슈 방지
            window.addEventListener('touchmove', function() {}, {passive: false});
            init();
        });

        function init() {

            renderLayout();
        }

        function clearUserData() {
            categories = [];
            selectedCategoryId = null;
            localStorage.removeItem(STORAGE_KEY);
            renderLayout();
        }

        function saveData() {
            if (window.isUserLoggedIn && window.isUserLoggedIn()) {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(categories));
                if (window.saveToCloud) window.saveToCloud();
            } else {
                showToast('로그인이 필요합니다. 변경사항이 백업되지 않을 수 있습니다.', 'warning');

        function generateId() {
            return Math.random().toString(36).substr(2, 9) + Date.now().toString(36);
        }

        function changeSort(sortMode) {
            currentSortMode = sortMode;
            renderLayout();
        }

        // 검색 실행 함수
        window.executeWebSearch = function() {
            const input = document.getElementById('web-search-input');
            const engine = document.getElementById('search-engine').value;
            const query = input.value.trim();
            
            if (!query) {
                showToast('검색어를 입력해주세요.', 'warning');
                input.focus();
                return;
            }

            let searchUrl = '';
            if (engine === 'google') {
                searchUrl = `https://www.google.com/search?q=${encodeURIComponent(query)}`;
            } else if (engine === 'naver') {
                searchUrl = `https://search.naver.com/search.naver?query=${encodeURIComponent(query)}`;
            }

            // 새 창에서 검색 결과 열기
            window.open(searchUrl, '_blank');
        };

        // 검색 URL을 북마크로 저장
        window.saveSearchAsBookmark = function() {
            if (!selectedCategoryId) {
                showToast('먼저 저장할 카테고리를 선택하거나 만들어주세요.', 'warning');
                return;
            }

            const input = document.getElementById('web-search-input');
            const engine = document.getElementById('search-engine').value;
            const query = input.value.trim();
            
            if (!query) {
                showToast('검색어를 먼저 입력해주세요.', 'warning');
                input.focus();
                return;
            }

            let searchUrl = '';
            if (engine === 'google') {
                searchUrl = `https://www.google.com/search?q=${encodeURIComponent(query)}`;
            } else if (engine === 'naver') {
                searchUrl = `https://search.naver.com/search.naver?query=${encodeURIComponent(query)}`;
            }

            // 검색용 모달 오픈
            openBookmarkModal(selectedCategoryId);
            
            // 모달 내 입력 필드 자동 채우기
            setTimeout(() => {
                const urlInput = document.getElementById('bookmark-url');
                const titleInput = document.getElementById('bookmark-title');
                
                urlInput.value = searchUrl;
                titleInput.value = `'${query}' 검색 결과 (${engine.toUpperCase()})`;
                
                // 수동 메타데이터 fetch 트리거
                fetchMetadata(searchUrl);
            }, 50);
        };

        function sortCategories() {
            return [...categories].sort((a, b) => {
                if (currentSortMode === 'updatedAt_desc') return (b.updatedAt || 0) - (a.updatedAt || 0);
                if (currentSortMode === 'updatedAt_asc') return (a.updatedAt || 0) - (b.updatedAt || 0);
                if (currentSortMode === 'createdAt_desc') return (b.createdAt || 0) - (a.createdAt || 0);
                if (currentSortMode === 'createdAt_asc') return (a.createdAt || 0) - (b.createdAt || 0);
                if (currentSortMode === 'name_asc') return a.name.localeCompare(b.name, 'ko-KR');
                if (currentSortMode === 'name_desc') return b.name.localeCompare(a.name, 'ko-KR');
                return 0;
            });
        }

        function selectCategory(id) {
            selectedCategoryId = id;
            renderMainContent();
            renderSidebar();
        }

        function renderLayout() {
            renderSidebar();
            if (!selectedCategoryId || !categories.find(c => c.id === selectedCategoryId)) {
                const sorted = sortCategories();
                selectedCategoryId = sorted.length > 0 ? sorted[0].id : null;
            }
            renderMainContent();
        }

        
        // 1. 공통 Drag 시작 이벤트
        window.handleDragStart = function(e, categoryId, bookmarkId) {
            e.dataTransfer.setData('application/json', JSON.stringify({ categoryId, bookmarkId }));
            e.dataTransfer.effectAllowed = 'move';
            
            // 모바일에서 드래그 시 고스트 이미지 최적화
            setTimeout(() => { e.target.classList.add('opacity-50'); }, 0);
        };
        window.handleDragEnd = function(e) {
            e.target.classList.remove('opacity-50');
        };

        // 2. 카테고리(사이드바) 이동 Drag & Drop 처리
        window.handleSidebarDragOver = function(e) {
            e.preventDefault();
            e.currentTarget.classList.add('drag-over');
        };
        window.handleSidebarDragLeave = function(e) {
            e.currentTarget.classList.remove('drag-over');
        };
        window.handleSidebarDrop = function(e, targetCategoryId) {
            e.preventDefault();
            e.currentTarget.classList.remove('drag-over');
            try {
                const data = JSON.parse(e.dataTransfer.getData('application/json'));
                if (data.categoryId === targetCategoryId) return; 
                
                const sourceCat = categories.find(c => c.id === data.categoryId);
                const targetCat = categories.find(c => c.id === targetCategoryId);
                
                if (sourceCat && targetCat) {
                    const bmIndex = sourceCat.bookmarks.findIndex(b => b.id === data.bookmarkId);
                    if (bmIndex > -1) {
                        const bm = sourceCat.bookmarks.splice(bmIndex, 1)[0];
                        targetCat.bookmarks.unshift(bm); 
                        sourceCat.updatedAt = Date.now();
                        targetCat.updatedAt = Date.now();
                        saveData();
                        showToast('링크가 새 카테고리로 이동되었습니다.', 'success');
                    }
                }
            } catch (err) { console.error("Sidebar Drop failed:", err); }
        };

        // 3. 카드 순서 변경(Reordering) Drag & Drop 처리
        window.handleCardDragOver = function(e) {
            e.preventDefault();
            e.currentTarget.classList.add('card-drag-over');
        };
        window.handleCardDragLeave = function(e) {
            e.currentTarget.classList.remove('card-drag-over');
        };
        window.handleCardDrop = function(e, targetCategoryId, targetBookmarkId) {
            e.preventDefault();
            e.currentTarget.classList.remove('card-drag-over');
            
            try {
                const data = JSON.parse(e.dataTransfer.getData('application/json'));
                
                // 동일 카테고리 내부에서의 순서 변경(Reorder) 로직
                if (data.categoryId === targetCategoryId && data.bookmarkId !== targetBookmarkId) {
                    const cat = categories.find(c => c.id === targetCategoryId);
                    const sourceIdx = cat.bookmarks.findIndex(b => b.id === data.bookmarkId);
                    const targetIdx = cat.bookmarks.findIndex(b => b.id === targetBookmarkId);
                    
                    if (sourceIdx > -1 && targetIdx > -1) {
                        const [movedBm] = cat.bookmarks.splice(sourceIdx, 1);
                        // 목표 위치 앞에 삽입 (순서 교체)
                        cat.bookmarks.splice(targetIdx, 0, movedBm);
                        cat.updatedAt = Date.now();
                        saveData();
                        // 순서 변경 시 조용한 UI 피드백
                    }
                }
            } catch(err) { console.error("Card Drop failed:", err); }
        };

        function renderSidebar() {
            const listContainer = document.getElementById('sidebar-category-list');

            const isLoggedIn = window.isUserLoggedIn && window.isUserLoggedIn();
            if (!isLoggedIn) {
                listContainer.innerHTML = `<div class="p-4 text-center text-xs text-gray-400">로그인 후 카테고리가 표시됩니다.</div>`;
                return;
            }

            const sortedCategories = sortCategories();

            sortedCategories.forEach(cat => {
                const isSelected = cat.id === selectedCategoryId;
                const bookmarkCount = cat.bookmarks ? cat.bookmarks.length : 0;
                
                const itemDiv = document.createElement('div');
                itemDiv.className = `w-full text-left px-3 py-2.5 rounded-lg flex items-center justify-between gap-2 transition-all duration-200 group cursor-pointer border ${
                    isSelected 
                        ? 'bg-indigo-50 text-indigo-700 font-bold border-indigo-100 shadow-sm' 
                        : 'text-gray-600 hover:bg-gray-50 hover:text-gray-900 border-transparent'
                }`;
                
                // 사이드바 Drop 타겟 바인딩
                itemDiv.ondragover = (e) => window.handleSidebarDragOver(e);
                itemDiv.ondragleave = (e) => window.handleSidebarDragLeave(e);
                itemDiv.ondrop = (e) => window.handleSidebarDrop(e, cat.id);
                
                itemDiv.onclick = (e) => {
                    if(!e.target.closest('button')) selectCategory(cat.id);
                };
                
                itemDiv.innerHTML = `
                    <div class="flex items-center gap-3 overflow-hidden flex-grow pointer-events-none">

                                <i class="fas fa-edit text-[10px]"></i>

                                <i class="fas fa-trash-alt text-[10px]"></i>
                            </button>
                        </div>
                    </div>
                `;
                
                listContainer.appendChild(itemDiv);
            });
        }

        window.togglePin = function(e, categoryId, bookmarkId) {
            e.stopPropagation();
            const btn = e.currentTarget;
            
            // 핀 애니메이션 CSS 클래스 적용
            btn.classList.add('pin-animating');
            
            // 애니메이션 지속 시간(0.4초) 대기 후 데이터 변경 및 리렌더링
            setTimeout(() => {
                const cat = categories.find(c => c.id === categoryId);
                if(cat) {
                    const bm = cat.bookmarks.find(b => b.id === bookmarkId);
                    if(bm) {
                        bm.isPinned = !bm.isPinned;
                        cat.updatedAt = Date.now();
                        saveData();
                        showToast(bm.isPinned ? '상단에 고정되었습니다.' : '상단 고정이 해제되었습니다.', 'success');
                    }
                }
            }, 400); 
        };

        function openCategoryModal(categoryId = null) {

                showToast('구글 로그인 후 카테고리를 이용하실 수 있습니다.', 'warning');

            const modalTitle = document.getElementById('category-modal-title');
            const saveBtnText = document.getElementById('btn-save-category');
            const editIdInput = document.getElementById('edit-category-id');
            
            errorMsg.classList.add('hidden');
            
            if (categoryId) {
                const category = categories.find(c => c.id === categoryId);
                if (!category) return;
                modalTitle.textContent = '카테고리 수정';
                saveBtnText.innerHTML = '<i class="fas fa-save"></i> 수정하기';
                editIdInput.value = categoryId;

                const categoryIndex = categories.findIndex(c => c.id === editId);

                    categories[categoryIndex].updatedAt = Date.now();
                    showToast('카테고리가 수정되었습니다.', 'success');
                }

                categories.push({
                    id: generateId(),
                    name: name,
                    icon: icon,
                    bookmarks: [],
                    createdAt: Date.now(),
                    updatedAt: Date.now()

        let currentMetadata = null;

        function importDataFromJson(event) {
            if (!window.isUserLoggedIn || !window.isUserLoggedIn()) return;
            const fileReader = new FileReader();
            fileReader.onload = function(e) {
                try {
                    const importedCategories = JSON.parse(e.target.result);

        function isValidUrl(string) {
            try { new URL(string); return true; } catch (_) { return false; }
        }

        async function fetchMetadata(url) {
            if (!url) return;
            if (!/^https?:\/\//i.test(url)) { url = 'http://' + url; document.getElementById('bookmark-url').value = url; }
            if (!isValidUrl(url)) { document.getElementById('url-error').classList.remove('hidden'); return; }
            
            document.getElementById('url-error').classList.add('hidden');
            const loading = document.getElementById('loading-indicator');
            const previewArea = document.getElementById('preview-area');
            const btnSave = document.getElementById('btn-save-bookmark');
            
            loading.classList.remove('hidden');
            previewArea.classList.add('hidden');
            btnSave.disabled = true;
            btnSave.classList.add('opacity-70', 'cursor-not-allowed');
            
            try {
                const apiUrl = `https://api.microlink.io?url=${encodeURIComponent(url)}`;
                const response = await fetch(apiUrl);
                const data = await response.json();
                
                if (data.status === 'success') {
                    const result = data.data;
                    currentMetadata = { title: result.title || '', description: result.description || '', image: result.image?.url || '', domain: new URL(url).hostname.replace('www.', '') };
                    const titleInput = document.getElementById('bookmark-title');
                    const descInput = document.getElementById('bookmark-desc');
                    if (!titleInput.value) titleInput.value = currentMetadata.title;
                    if (!descInput.value) descInput.value = currentMetadata.description;
                    
                    if (currentMetadata.image) {
                        document.getElementById('preview-img').src = currentMetadata.image;
                    } else {
                        const domainInitials = currentMetadata.domain.charAt(0).toUpperCase();
                        const color = stringToColor(currentMetadata.domain);
                        document.getElementById('preview-img').src = `https://placehold.co/400x300/${color.replace('#','')}/FFFFFF?text=${domainInitials}`;
                    }
                    document.getElementById('preview-title').textContent = currentMetadata.title || url;
                    document.getElementById('preview-domain').textContent = currentMetadata.domain;
                    previewArea.classList.remove('hidden');
                }
            } catch (error) {
                currentMetadata = { title: '', description: '', image: '', domain: new URL(url).hostname.replace('www.', '') };
            } finally {
                loading.classList.add('hidden');
                btnSave.disabled = false;
                btnSave.classList.remove('opacity-70', 'cursor-not-allowed');
            }
        }

        function saveBookmark() {
            const categoryId = document.getElementById('target-category-id').value;
            const editBookmarkId = document.getElementById('edit-bookmark-id').value;
            let url = document.getElementById('bookmark-url').value.trim();
            const title = document.getElementById('bookmark-title').value.trim();
            const desc = document.getElementById('bookmark-desc').value.trim();
            
            if (!url) { document.getElementById('url-error').classList.remove('hidden'); return; }
            if (!/^https?:\/\//i.test(url)) url = 'http://' + url;
            if (!isValidUrl(url)) { document.getElementById('url-error').classList.remove('hidden'); return; }

            const categoryIndex = categories.findIndex(c => c.id === categoryId);
            if (categoryIndex === -1) return;

            let domain = "";
            try { domain = new URL(url).hostname.replace('www.', ''); } catch(e) {}

            if (editBookmarkId) {
                const bookmarkIndex = categories[categoryIndex].bookmarks.findIndex(b => b.id === editBookmarkId);
                if (bookmarkIndex > -1) {
                    const existingBookmark = categories[categoryIndex].bookmarks[bookmarkIndex];
                    categories[categoryIndex].bookmarks[bookmarkIndex] = {
                        ...existingBookmark,
                        url: url,
                        title: title || (currentMetadata && currentMetadata.title) || domain,
                        desc: desc || (currentMetadata && currentMetadata.description) || '',
                        image: (currentMetadata && currentMetadata.image !== undefined) ? currentMetadata.image : existingBookmark.image,
                        domain: domain
                    };
                    categories[categoryIndex].updatedAt = Date.now();
                    showToast('링크가 수정되었습니다.', 'success');
                }
            } else {
                categories[categoryIndex].bookmarks.unshift({
                    id: generateId(),
                    url: url,
                    title: title || (currentMetadata && currentMetadata.title) || domain,
                    desc: desc || (currentMetadata && currentMetadata.description) || '',
                    image: (currentMetadata && currentMetadata.image) || '',
                    domain: domain,
                    addedAt: Date.now(),
                    isPinned: false
                });
                categories[categoryIndex].updatedAt = Date.now();
                showToast('링크가 저장되었습니다.', 'success');
            }
            saveData();
            closeBookmarkModal();
        }

        function deleteBookmark(categoryId, bookmarkId) {
            const categoryIndex = categories.findIndex(c => c.id === categoryId);
            if (categoryIndex === -1) return;
            showConfirm("링크 삭제", "이 링크를 삭제하시겠습니까?", () => {
                categories[categoryIndex].bookmarks = categories[categoryIndex].bookmarks.filter(b => b.id !== bookmarkId);
                categories[categoryIndex].updatedAt = Date.now();
                saveData();
                showToast('링크가 삭제되었습니다.', 'info');
            });
        }

        function escapeHtml(unsafe) {
            if (!unsafe) return '';
            return unsafe.toString().replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        function stringToColor(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) hash = str.charCodeAt(i) + ((hash << 5) - hash);
            let color = '#';
            for (let i = 0; i < 3; i++) {
                const value = (hash >> (i * 8)) & 0xFF;
                color += ('00' + Math.max(50, Math.min(200, value)).toString(16)).substr(-2);
            }
            return color;
        }

        function copyToClipboard(text) {
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(() => {
                    showToast('링크가 클립보드에 복사되었습니다.', 'success');
                }).catch(err => {
                    fallbackCopyTextToClipboard(text);
                });
            } else {
                fallbackCopyTextToClipboard(text);
            }
        }

        function fallbackCopyTextToClipboard(text) {
            var textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try { document.execCommand('copy'); showToast('링크가 클립보드에 복사되었습니다.', 'success'); } 
            catch (err) { console.error('Copy failed', err); }
            document.body.removeChild(textArea);
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            let bgClass = 'bg-gray-800', icon = 'fa-info-circle', iconColor = 'text-blue-400';
            
            if (type === 'success') { icon = 'fa-check-circle'; iconColor = 'text-green-400'; } 
            else if (type === 'warning') { icon = 'fa-exclamation-triangle'; iconColor = 'text-yellow-400'; } 
            else if (type === 'error') { icon = 'fa-times-circle'; iconColor = 'text-red-400'; }

            toast.className = `flex items-center gap-3 px-4 py-3 rounded-lg shadow-lg text-white text-sm transform transition-all duration-300 translate-y-10 opacity-0 ${bgClass}`;
            toast.innerHTML = `<i class="fas ${icon} ${iconColor} text-lg"></i><span class="font-medium">${escapeHtml(message)}</span>`;
            
            container.appendChild(toast);
            requestAnimationFrame(() => {
                toast.classList.remove('translate-y-10', 'opacity-0');
                toast.classList.add('translate-y-0', 'opacity-100');
            });
            
            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => { if (container.contains(toast)) container.removeChild(toast); }, 300);
            }, 3500);
        }
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        let db, auth, currentUser;
        let unsubscribeSnapshot = null;

        const firebaseConfig = {
            apiKey: "AIzaSyBFScKLj-kSpOx7ZlD9YPYLeK5y8BPHTX4",
            authDomain: "bookmark-dashboard-345cc.firebaseapp.com",
            projectId: "bookmark-dashboard-345cc",
            storageBucket: "bookmark-dashboard-345cc.firebasestorage.app",
            messagingSenderId: "1064431939109",
            appId: "1:1064431939109:web:a867509734c203952719cc"
        };

        async function initFirebase() {
            try {
                const app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);

                onAuthStateChanged(auth, (user) => {
                    currentUser = user;
                    updateAuthUI(user);

                    if (user) {
                        listenToCloudChanges(user.uid);
                    } else {
                        if (unsubscribeSnapshot) unsubscribeSnapshot();
                        clearUserData();
                        updateCloudSyncStatus('disconnected');
                    }
                });
            } catch (error) {
                console.error("Firebase 초기화 에러:", error);
                updateCloudSyncStatus('error', error.message);
            }
        }

        function isUserLoggedIn() {
            return !!currentUser;
        }

        function updateAuthUI(user) {
            const authSection = document.getElementById('auth-section');
            if (!authSection) return;

            if (user) {
                const displayName = user.displayName || user.email || user.uid.substring(0, 8);
                const photoURL = user.photoURL;

                authSection.innerHTML = `
                    <div class="flex items-center gap-2 bg-indigo-50 border border-indigo-100 rounded-lg px-2.5 py-1.5">
                        ${photoURL ? `<img src="${photoURL}" class="w-6 h-6 rounded-full">` : '<i class="fas fa-user-circle text-indigo-600 text-lg"></i>'}
                        <span class="text-xs font-bold text-indigo-900 max-w-[120px] sm:max-w-[180px] truncate">${escapeHtml(displayName)}</span>
                        <button onclick="window.handleGoogleLogout()" class="ml-1 text-xs text-red-500 hover:text-red-700 font-bold hover:underline cursor-pointer">로그아웃</button>
                    </div>
                `;
                updateCloudSyncStatus('connected', displayName);
            } else {
                authSection.innerHTML = `
                    <button onclick="window.handleGoogleLogin()" class="px-3 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs sm:text-sm font-bold transition-all shadow-sm flex items-center gap-2 cursor-pointer">
                        <i class="fab fa-google"></i> 구글 로그인
                    </button>
                `;
                updateCloudSyncStatus('disconnected');
            }
        }

        function updateCloudSyncStatus(status, extraInfo = '') {
            const statusEl = document.getElementById('cloud-sync-status');
            if (!statusEl) return;

            if (status === 'connected') {
                statusEl.innerHTML = `
                    <span class="relative flex h-3 w-3">
                      <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                      <span class="relative inline-flex rounded-full h-3 w-3 bg-green-500"></span>
                    </span>
                    <span class="text-green-700 font-bold">연결됨 (${escapeHtml(extraInfo)})</span>
                `;
            } else if (status === 'disconnected') {
                statusEl.innerHTML = `
                    <span class="relative flex h-3 w-3">
                      <span class="relative inline-flex rounded-full h-3 w-3 bg-yellow-500"></span>
                    </span>
                    <span class="text-yellow-700 font-bold">로그인이 필요합니다</span>
                    <button onclick="window.handleGoogleLogin()" class="ml-2 px-2.5 py-1 bg-indigo-600 text-white text-xs rounded-md hover:bg-indigo-700 transition-colors font-bold cursor-pointer">구글 로그인하기</button>
                `;
            } else {
                statusEl.innerHTML = `
                    <span class="relative flex h-3 w-3">
                      <span class="relative inline-flex rounded-full h-3 w-3 bg-red-500"></span>
                    </span>
                    <span class="text-red-600 font-bold">연결 오류 (${escapeHtml(extraInfo)})</span>
                `;
            }
        }

        async function handleGoogleLogin() {
            try {
                if (!auth) {
                    showToast('Firebase 초기화 중입니다. 잠시 후 다시 시도해 주세요.', 'warning');
                    return;
                }
                const provider = new GoogleAuthProvider();
                provider.setCustomParameters({ prompt: 'select_account' });
                
                showToast('구글 로그인 창을 띄웁니다...', 'info');
                await signInWithPopup(auth, provider);
                showToast('구글 로그인에 성공했습니다!', 'success');
            } catch (error) {
                console.error("로그인 에러:", error);
                if (error.code !== 'auth/popup-closed-by-user') {
                    showToast(`로그인 실패: ${error.message}`, 'error');
                }
            }
        }

        async function handleGoogleLogout() {
            try {
                if (auth) {
                    await signOut(auth);
                    if (unsubscribeSnapshot) unsubscribeSnapshot();
                    clearUserData();
                    showToast('로그아웃되었습니다.', 'info');
                }
            } catch (error) {
                console.error("로그아웃 에러:", error);
            }
        }

        function listenToCloudChanges(userId) {
            if (!db) return;
            const docRef = doc(db, "users", userId);

            unsubscribeSnapshot = onSnapshot(docRef, (docSnap) => {
                if (docSnap.exists()) {
                    const cloudData = docSnap.data().categories;
                    if (cloudData && Array.isArray(cloudData)) {
                        categories = cloudData;
                        localStorage.setItem(STORAGE_KEY, JSON.stringify(categories));
                        renderLayout();
                        
                        // 데이터 렌더링 완료 후 URL 파라미터 체크 (추가됨)
                        checkUrlParamsForBookmark();
                    }
                } else {
                    saveToCloud();
                }
            }, (error) => {
                console.error("실시간 동기화 오류:", error);
            });
        }

        async function saveToCloud() {
            if (!currentUser || !db) return;
            try {
                const docRef = doc(db, "users", currentUser.uid);
                await setDoc(docRef, {
                    categories: categories,
                    updatedAt: Date.now()
                }, { merge: true });
            } catch (error) {
                console.error("클라우드 저장 실패:", error);
            }
        }

        // 글로벌 window 객체에 연결
        window.handleGoogleLogin = handleGoogleLogin;
        window.handleGoogleLogout = handleGoogleLogout;
        window.saveToCloud = saveToCloud;
        window.openDataModal = openDataModal;
        window.closeDataModal = closeDataModal;
        window.exportDataToJson = exportDataToJson;
        window.importDataFromJson = importDataFromJson;
        window.isUserLoggedIn = isUserLoggedIn;

        initFirebase();
    </script>
</body>
</html>
